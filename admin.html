    function FormattedText({ text }) {
      const parts = text.split(/(\*\*.*?\*\*)/g);
      return (
        <span>
          {parts.map((part, i) => {
            if (part.startsWith('**') && part.endsWith('**')) {
              return <strong key={i} className="font-extrabold text-amber-300">{part.slice(2, -2)}</strong>;
            }
            return part;
          })}
        </span>
      );
    }

    function MarkdownRenderer({ content }) {
      if (!content) return null;
      const lines = content.split('\n');
      return (
        <div className="space-y-3.5 text-slate-200 text-sm leading-relaxed">
          {lines.map((line, idx) => {
            const trimmed = line.trim();
            if (!trimmed) return <div key={idx} className="h-1.5" />;
            if (trimmed.startsWith('### ')) {
              return (
                <h4 key={idx} className="text-base font-bold text-indigo-300 mt-4 mb-1">
                  {trimmed.replace(/^###\s+/, '')}
                </h4>
              );
            }
            if (trimmed.startsWith('## ')) {
              return (
                <h3 key={idx} className="text-lg font-extrabold text-white mt-5 mb-2 pb-1 border-b border-slate-700">
                  {trimmed.replace(/^##\s+/, '')}
                </h3>
              );
            }
            if (trimmed.startsWith('# ')) {
              return (
                <h2 key={idx} className="text-xl font-black text-indigo-200 mt-6 mb-3">
                  {trimmed.replace(/^#\s+/, '')}
                </h2>
              );
            }
            if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
              return (
                <li key={idx} className="ml-5 list-disc leading-relaxed text-slate-300">
                  <FormattedText text={trimmed.replace(/^[-*]\s+/, '')} />
                </li>
              );
            }
            return (
              <p key={idx} className="leading-relaxed">
                <FormattedText text={trimmed} />
              </p>
            );
          })}
        </div>
      );
    }

        if (e) e.preventDefault();
        if (passwordInput === ADMIN_PASSWORD) {
          try {
            sessionStorage.setItem(AUTH_STORAGE_KEY, 'true');
          } catch (err) {}
          setIsAuthenticated(true);
          setPasswordError('');
          setPasswordInput('');
        } else {

          setPasswordInput('');
          setPasswordError('');

        const unsubscribe = MindDB.subscribe(

            const list = data || [];
            // 신규 데이터 수신 감지 (최초 로드 이후 개수 증가 시)
            if (prevRecordCountRef.current !== null && list.length > prevRecordCountRef.current) {

              const nick = latest ? (latest.nickname || '익명 내담자') : '내담자';

                nickname: nick,
                time: new Date().toLocaleTimeString(),
                id: latest ? latest.id : Date.now()
              });
              setTimeout(() => {
                setNewArrivalAlert(null);
              }, 6000);
            }
            prevRecordCountRef.current = list.length;
            setRecords(list);
            setDbStatus(MindDB.getStatus());
          },
          (err) => {
            console.error("DB 리스너 오류:", err);
            setDbStatus(MindDB.getStatus());
          }
        );

        return () => {
          if (typeof unsubscribe === 'function') unsubscribe();
        };

        MindDB.getAll().then(data => {
          setRecords(data || []);
          setDbStatus(MindDB.getStatus());

          setNotes([]);
          setProfileGender('미지정');
          setProfileAge('');
          setProfileIntakeDate('');
          setProfileConcern('');
          return;

        const p = profiles[selectedNickname];

          setProfileAge(p.age || '');
          setProfileIntakeDate(p.intakeDate || '');
          setProfileConcern(p.primaryConcern || '');
        } else {
          MindDB.Profile.get(selectedNickname).then(fetched => {
            if (fetched) {
              setProfileGender(fetched.gender || '미지정');
              setProfileAge(fetched.age || '');
              setProfileIntakeDate(fetched.intakeDate || '');
              setProfileConcern(fetched.primaryConcern || '');
            } else {
              setProfileGender('미지정');
              setProfileAge('');
              setProfileIntakeDate(new Date().toLocaleDateString('ko-KR'));
              setProfileConcern('');
            }
          });
        }

        const unsubNotes = MindDB.Notes.subscribe(selectedNickname, (list) => {
          setNotes(list || []);
        });

        return () => {
          if (typeof unsubNotes === 'function') unsubNotes();
        };

        if (!selectedNickname) {
          alert("먼저 좌측에서 특정 내담자를 선택해 주세요.");
          return;

        setIsSavingProfile(true);
        try {

            nickname: selectedNickname,
            gender: profileGender,
            age: profileAge ? Number(profileAge) : '',
            intakeDate: profileIntakeDate || new Date().toLocaleDateString('ko-KR'),
            primaryConcern: profileConcern.trim(),
            updatedAt: new Date().toISOString()
          };
          await MindDB.Profile.save(updated);
          setProfiles(prev => ({ ...prev, [selectedNickname]: updated }));
          alert(`[${selectedNickname}] 님의 기본 정보가 클라우드 DB에 안전하게 저장되었습니다.\n(내담자 앱에는 노출되지 않는 비밀 정보입니다)`);
        } finally {
          setIsSavingProfile(false);
        }
      };

          alert("메모 내용을 입력해 주세요.");
          return;

          const now = new Date();
          const pad = n => n.toString().padStart(2, '0');
          const dateStr = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

            id: Date.now(),
            nickname: selectedNickname,
            category: noteCategory,
            title: noteTitle.trim() || `${now.toLocaleDateString('ko-KR')} 상담 메모`,

            createdAt: now.toISOString()

      const handleClearAll = async () => {
        if (confirm("정말로 모든 세션 데이터를 초기화(삭제)하시겠습니까?\n이 작업은 되돌릴 수 없습니다.")) {

      const handleMigrate = async () => {
        try {
          setDbMessage('로컬 데이터를 클라우드로 전송 중...');

          setDbMessage(result.message);
          refreshData();

          setDbMessage('마이그레이션 실패: ' + err.message);

      const handleTestConnection = async () => {
        setIsTesting(true);
        setDbMessage('클라우드 DB 연결 및 권한 확인 중...');
        try {
          const res = await MindDB.testConnection();
          if (res.success) {
            setDbMessage('✅ ' + res.message);
          } else {
            setDbMessage('❌ 연결 실패: ' + res.error);
          }

          setIsTesting(false);

      const handleCopyClientUrl = () => {
        const clientUrl = MindDB.generateClientInviteUrl();
        navigator.clipboard.writeText(clientUrl).then(() => {
          alert("📱 내담자 원클릭 접속 링크가 클립보드에 복사되었습니다!\n\n이 링크를 내담자의 스마트폰이나 개인 PC로 전달하시면, 별도 DB 설정 없이 바로 동일한 클라우드 DB에 연결되어 설문을 제출할 수 있습니다.");
        }).catch(() => {
          prompt("아래 링크를 복사하여 내담자에게 전달하세요:", clientUrl);
        });
      };

      // Firebase 설정 저장
      const handleSaveConfig = () => {
        try {
          const parsed = JSON.parse(configInput);
          if (!parsed.apiKey || !parsed.projectId) {
            alert("apiKey와 projectId는 필수 항목입니다.");
            return;
          }
          const res = MindDB.saveConfig(parsed);
          if (res.success) {
            alert("Firebase 클라우드 DB가 성공적으로 설정되었습니다!\n연결 테스트를 진행합니다.");
            setShowDbModal(false);
            setDbStatus(MindDB.getStatus());
            refreshData();
            handleTestConnection();
          } else {
            alert("Firebase 연결 실패: " + (res.error || '설정값을 확인하세요.'));
          }
        } catch (e) {
          alert("JSON 형식이 올바르지 않습니다. 중괄호 {} 형태의 JSON 객체를 붙여넣어 주세요.");
        }
      };

      // Firebase 설정 초기화 (로컬 모드로 전환)
      const handleResetConfig = () => {
        if (confirm("Firebase 설정을 제거하고 로컬 브라우저 모드로 전환하시겠습니까?")) {
          MindDB.resetConfig();
          setDbStatus(MindDB.getStatus());
          setShowDbModal(false);
          refreshData();
        }
      };

      // 고유 닉네임 목록 도출
      const nicknames = useMemo(() => {
        const set = new Set(records.map(r => r.nickname || '익명'));
        return Array.from(set);
      }, [records]);

      // 선택된 내담자 1인의 세션 기록 목록 (철저한 개인별 격리)
      const filteredRecords = useMemo(() => {
        if (!selectedNickname) return [];
        return records.filter(r => (r.nickname || '익명') === selectedNickname);
      }, [records, selectedNickname]);

      // 현재 분석 대상 세션(선택된 내담자의 특정 세션 or 선택된 내담자의 전체 누적 세션)
      const targetChains = useMemo(() => {
        if (!selectedNickname) return [];
        if (selectedSessionId) {
          const found = filteredRecords.filter(r => r.id === selectedSessionId);
          return found.length > 0 ? found : filteredRecords;
        }
        return filteredRecords;
      }, [filteredRecords, selectedSessionId, selectedNickname]);

      // 네트워크 통계 지표 계산
      const metrics = useMemo(() => {
        const countsByType = {
          '컨디션': {}, '계기': {}, '생각': {}, '감정': {},
          '몸느낌': {}, '행동': {}, '결과': {}, '긍정대처': {}
        };
        const allCounts = {};
        const inDeg = {}, outDeg = {};
        const transitions = {};

        targetChains.forEach(c => {
          c.sequence.forEach((s, idx) => {
            const label = s.label;
            allCounts[label] = (allCounts[label] || 0) + 1;
            if (countsByType[s.type]) {
              countsByType[s.type][label] = (countsByType[s.type][label] || 0) + 1;
            }
            if (idx > 0) inDeg[label] = (inDeg[label] || 0) + 1;
            if (idx < c.sequence.length - 1) {
              outDeg[label] = (outDeg[label] || 0) + 1;
              const next = c.sequence[idx + 1];
              const pair = `${label} ➔ ${next.label}`;
              transitions[pair] = (transitions[pair] || 0) + 1;
            }
          });
        });

        const getTop = (obj, fallback) => {
          const sorted = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
          return sorted[0] ? sorted[0][0] : fallback;
        };

        const sortedAll = Object.entries(allCounts).sort((a, b) => b[1] - a[1]);
        const topBottleneck = getTop(countsByType['행동'], sortedAll[0]?.[0] || '하루 종일 누워있기');
        const ignitionNode = Object.entries(outDeg).sort((a, b) => b[1] - a[1])[0]?.[0] || getTop(countsByType['계기'], '가족과 말다툼');
        const topCondition = getTop(countsByType['컨디션'], '수면 부족 및 피로');
        const topTrigger = getTop(countsByType['계기'], '대인관계 갈등');
        const topThought = getTop(countsByType['생각'], '부정적 자동적 사고');
        const topEmotion = getTop(countsByType['감정'], '불안 및 무기력');
        const topBody = getTop(countsByType['몸느낌'], '가슴 답답함 및 신체 긴장');
        const topOutcome = getTop(countsByType['결과'], '자책감 및 피로 누적');
        const topPositiveCoping = getTop(countsByType['긍정대처'], '따뜻한 차 마시기 및 심호흡');

        const topTransition = Object.entries(transitions).sort((a, b) => b[1] - a[1])[0]?.[0] || `${topBody} ➔ ${topBottleneck}`;

        return {
          totalChains: targetChains.length,
          totalNodes: Object.keys(allCounts).length,
          topBottleneck,
          ignitionNode,
          topCondition,
          topTrigger,
          topThought,
          topEmotion,
          topBody,
          topOutcome,
          topPositiveCoping,
          topTransition,
          countsByType,
          transitions
        };
      }, [targetChains]);

      // D3 네트워크 그래프 렌더링
      useEffect(() => {
        if (activeTab === 'network' && svgRef.current && targetChains.length > 0) {
          renderD3Network();
        }
      }, [activeTab, targetChains]);

      const renderD3Network = () => {
        const targetSvg = svgRef.current;
        if (!targetSvg) return;

        const nodeMap = new Map();
        const edgeMap = new Map();

        targetChains.forEach(c => {
          const seq = c.sequence;
          for (let i = 0; i < seq.length; i++) {
            const cur = seq[i];
            const id = cur.label;
            if (!nodeMap.has(id)) {
              nodeMap.set(id, { id, label: cur.label, type: cur.type, count: 1 });
            } else {
              nodeMap.get(id).count += 1;
            }

            if (i < seq.length - 1) {
              const next = seq[i + 1];
              const edgeKey = `${id}->${next.label}`;
              if (!edgeMap.has(edgeKey)) {
                edgeMap.set(edgeKey, { source: id, target: next.label, weight: 1 });
              } else {
                edgeMap.get(edgeKey).weight += 1;
              }
            }
          }
        });

        const nodes = Array.from(nodeMap.values());
        const edges = Array.from(edgeMap.values());

        const rect = targetSvg.getBoundingClientRect();
        const width = (rect && rect.width > 50) ? rect.width : 700;
        const height = 480;

        d3.select(targetSvg).selectAll("*").remove();
        const svg = d3.select(targetSvg).attr("viewBox", [0, 0, width, height]);
        const g = svg.append("g");

        const zoom = d3.zoom().scaleExtent([0.4, 3.5]).on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);

        // 화살표 마커
        svg.append("defs").append("marker")
          .attr("id", "admin-arrow")
          .attr("viewBox", "0 -5 10 10").attr("refX", 32).attr("refY", 0)
          .attr("markerWidth", 8).attr("markerHeight", 8).attr("orient", "auto")
          .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "#F59E0B");

        svg.append("defs").append("marker")
          .attr("id", "admin-arrow-green")
          .attr("viewBox", "0 -5 10 10").attr("refX", 32).attr("refY", 0)
          .attr("markerWidth", 8).attr("markerHeight", 8).attr("orient", "auto")
          .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "#10B981");

        const simulation = d3.forceSimulation(nodes)
          .force("link", d3.forceLink(edges).id(d => d.id).distance(140))
          .force("charge", d3.forceManyBody().strength(-450))
          .force("center", d3.forceCenter(width / 2, height / 2))
          .force("collision", d3.forceCollide().radius(60));

        const link = g.append("g").selectAll("line").data(edges).join("line")
          .attr("stroke", d => {
            const targetId = typeof d.target === 'object' ? d.target.id : d.target;
            const targetNode = nodes.find(n => n.id === targetId);
            return (targetNode && targetNode.type === '긍정대처') ? "#10B981" : "#FBBF24";
          })
          .attr("stroke-width", d => 2.5 + d.weight * 2)
          .attr("stroke-opacity", 0.85)
          .attr("stroke-dasharray", d => {
            const targetId = typeof d.target === 'object' ? d.target.id : d.target;
            const targetNode = nodes.find(n => n.id === targetId);
            return (targetNode && targetNode.type === '긍정대처') ? "5,3" : "none";
          })
          .attr("marker-end", d => {
            const targetId = typeof d.target === 'object' ? d.target.id : d.target;
            const targetNode = nodes.find(n => n.id === targetId);
            return (targetNode && targetNode.type === '긍정대처') ? "url(#admin-arrow-green)" : "url(#admin-arrow)";
          });

        const node = g.append("g").selectAll("g").data(nodes).join("g").style("cursor", "pointer")
          .call(d3.drag()
            .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
            .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
            .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

        node.append("circle")
          .attr("r", d => 24 + d.count * 6)
          .attr("fill", d => d.type === '긍정대처' ? '#065F46' : (d.count > 1 ? '#B45309' : '#1E293B'))
          .attr("stroke", d => d.type === '긍정대처' ? '#10B981' : (d.count > 1 ? '#F59E0B' : '#64748B'))
          .attr("stroke-width", 3);

        node.append("text")
          .text(d => d.label.length > 8 ? d.label.slice(0, 7) + '..' : d.label)
          .attr("text-anchor", "middle").attr("dy", 5)
          .attr("font-size", "12px").attr("font-weight", "bold")
          .attr("fill", "#F8FAFC");

        simulation.on("tick", () => {
          link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
          node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
      };

      // ==========================================
      // ★ 연구자/상담사용 LLM 개인별 자동 심층 소견서 엔진
      // ==========================================
      const generateResearcherReport = async () => {
        if (targetChains.length === 0 || !selectedNickname) return;

        setIsGenerating(true);
        const isSingleSession = !!selectedSessionId;
        const targetDesc = isSingleSession 
          ? `[${selectedNickname} 님] 단일 회기 세션 (ID: #${selectedSessionId})` 
          : `[${selectedNickname} 님] 개인 누적 ${targetChains.length}회기 종합 데이터`;
        setLastAnalyzedTarget(targetDesc);

        // 내담자 세션 데이터 요약 스트링
        const sessionDetails = targetChains.map((c, i) => 
          `[회기 ${i + 1}] 일시: ${c.date} | 내담자: ${selectedNickname}\n` +
          (c.sequence || []).map(s => `  - (${s.type}) ${s.label}`).join('\n')
        ).join('\n\n');

        const cleanKey = apiKey.trim();

        const clientProfile = profiles[selectedNickname] || null;
        const profileInfoStr = clientProfile 
          ? `내담자 [${selectedNickname} 님]: 성별 ${clientProfile.gender || '미지정'}, 만 ${clientProfile.age ? clientProfile.age + '세' : '연령 미상'}${clientProfile.primaryConcern ? ' (주호소: ' + clientProfile.primaryConcern + ')' : ''}`
          : `내담자 [${selectedNickname} 님] (개인 인적사항 미입력)`;

        // Gemini API 키가 있는 경우: 실제 실시간 LLM 개인별 자동 생성
        if (cleanKey) {
          try {
            const promptContext = isSingleSession
              ? `본 분석은 내담자의 [단일 회기(ID: #${selectedSessionId})]에 대한 정밀 기능적 행동분석(Functional Analysis, ABC-O Model) 소견서입니다. 8단계(선행 컨디션, 계기, 자동적 사고, 정서, 신체 각성, 회피 행동, 결과, 긍정 대처)의 단계별 연결고리를 행동주의적·인지치료적으로 심층 분석하세요.`
              : `본 분석은 내담자의 [누적 ${targetChains.length}개 회기]에 대한 종단적 상태 전이 네트워크 및 시계열 변화 궤적(Longitudinal Trajectory) 종합 소견서입니다. 회기간 행동 패턴의 변화, 중심 허브 노드, TRAP/TRAC 전환 가능성을 종합 규명하세요.`;

            const prompt = `당신은 행동활성화(Behavioral Activation, BA) 및 네트워크 심리측정학(Network Psychometrics) 분야의 권위 있는 수석 임상심리학자 겸 연구책임자입니다.
다음 내담자([${selectedNickname} 님])의 실제 개인 상태 전이 데이터 및 인적 프로필을 정밀 분석하고, 학술 연구 및 임상 사례보고서 수준의 [개인별 동적 상태 전이 네트워크 및 수반성 평가 소견서]를 작성해 주세요.
(중요 원칙: 본 소견서는 개인 맞춤형(idiographic) 임상 보고서입니다. 타인의 데이터나 일반론을 섞지 말고 오직 [${selectedNickname} 님]의 고유한 수반성 데이터와 행동 연쇄에만 집중하여 작성하십시오.)

[내담자 데이터 세부 내역]
분석 모드: ${promptContext}
분석 대상: ${targetDesc} (${profileInfoStr})
총 분석 체인 수: ${metrics.totalChains}회
고유 노드 수: ${metrics.totalNodes}개

${sessionDetails}

[네트워크 통계 지표]
- 최대 출차수 노드(Ignition / Out-Degree Trigger): ${metrics.ignitionNode} (${metrics.topTrigger})
- 주 취약 정서 및 신체 반응: ${metrics.topEmotion}, ${metrics.topBody}
- 자동적 인지 패턴(Automatic Thought): ${metrics.topThought}
- 최대 매개 중심성 노드(Hub / Core Avoidance Behavior): ${metrics.topBottleneck}
- 부적 강화 결과 및 이차 손실(Secondary Loss): ${metrics.topOutcome}
- 긍정적 대처 자원 노드(Positive Coping Resource): ${metrics.topPositiveCoping}
- 최다 빈도 전이 엣지: ${metrics.topTransition}

[작성 가이드라인 - ${selectedNickname} 님의 실제 데이터를 철저히 기반으로 서술할 것]
1. TRAP 모델 기반 동적 부적 강화 수반성 (Negative Reinforcement Contingency) 분석
2. 최적 중재 지점 (Targeted Circuit-Breaking Disruption Point) 및 인지/신체 개입 우선순위
3. TRAC 모델 기반 긍정적 대처 자원 [${metrics.topPositiveCoping}]의 미세 행동 활성화(Micro-Activation) 전략
4. 차기 회기 임상 치료 제언 및 핵심 모니터링 신호 3가지

형식: 전문 임상용 마크다운 형식으로 격조 높은 한국어 학술체로 작성하세요.`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${cleanKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.6, maxOutputTokens: 3000 }
              })
            });

            const data = await res.json();
            if (data.error) throw new Error(data.error.message || "API 호출 실패");
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) {
              setLlmReport(text);
              setIsGenerating(false);
              return;
            }
          } catch (e) {
            console.warn("Gemini API 호출 중 오류 발생, 고도화된 정밀 자동 임상 생성기로 대체합니다:", e);
          }
        }

        // Gemini API 키가 없거나 실패 시: 단일 회기 vs 누적 회기를 완벽히 분리한 고도화 동적 임상 소견서 생성
        let autoGeneratedReport = "";

        if (isSingleSession && targetChains.length === 1) {
          // [단일 세션 ABC-O 정밀 기능분석 모드]
          const single = targetChains[0];
          const seqMap = {};
          (single.sequence || []).forEach(s => { seqMap[s.type] = s.label; });

          const sCondition = seqMap['컨디션'] || metrics.topCondition;
          const sTrigger = seqMap['계기'] || metrics.topTrigger;
          const sThought = seqMap['생각'] || metrics.topThought;
          const sEmotion = seqMap['감정'] || metrics.topEmotion;
          const sBody = seqMap['몸느낌'] || metrics.topBody;
          const sAction = seqMap['행동'] || metrics.topBottleneck;
          const sOutcome = seqMap['결과'] || metrics.topOutcome;
          const sPositiveCoping = seqMap['긍정대처'] || metrics.topPositiveCoping;

          autoGeneratedReport = `> **[단일 세션 정밀 기능분석(Functional Analysis)]** ${profileInfoStr}
> **분석 대상**: 단일 회기 #${single.id} | 일시: ${single.date}

## 1. 선행사건 및 기저 취약성 평가 (Antecedent & Vulnerability Analysis)
본 회기에서 내담자 [${selectedNickname} 님]은 기저 컨디션인 **[${sCondition}]** 상태에서 주 촉발 계기인 **[${sTrigger}]**을(를) 경험하였습니다.
- **선행 자극의 기능**: 신체적·심리적 고갈 상태(${sCondition})는 자율신경계 반응 역치를 현저히 저하시켰으며, 촉발 사건(${sTrigger})이 인지적 위협(Cognitive Threat)으로 급격히 전환되는 결정적 선행 조건(Setting Event)으로 작용하였습니다.

## 2. 유기체 내적 반응의 삼원 상호작용 (Cognitive-Affective-Somatic Triad)
촉발 직후 내담자의 내적 시스템에서는 인지, 정서, 생리적 반응의 급격한 악순환 결속(Resonance)이 관찰됩니다.
- **자동적 사고 (Automatic Thought)**: "${sThought}"
- **지배적 정서 (Dominant Affect)**: **${sEmotion}**
- **신체적 반응 (Somatic/Physiological Arousal)**: **${sBody}**
- **임상적 평가**: 인지적 반추("${sThought}")가 촉발 정서(${sEmotion})를 즉각 증폭시키고, 이것이 자율신경계 각성(${sBody})으로 직결되는 전형적인 급성 부적 강화 수반 경로를 형성하고 있습니다.

## 3. 표적 행동 및 부적 강화 수반성 (Target Avoidance Behavior & Secondary Loss)
- **표적 행동**: **[${sAction}]**
- **행동의 기능(Function of Behavior)**: 내담자가 택한 [${sAction}]은 고통스러운 정서(${sEmotion})와 신체적 긴장(${sBody})으로부터 즉각 벗어나기 위한 단기 도피/회피(Escape/Avoidance) 반응입니다.
- **수반된 결과 및 이차 손실 (Secondary Loss)**: 행동 직후 일시적 안도감이 있었으나, 궁극적으로 **[${sOutcome}]**(으)로 귀결되었습니다. 이는 단기 부적 강화(Negative Reinforcement)의 덫으로 인해 장기적 자기효능감이 손상되고 고립이 심화되는 패턴을 명백히 보여줍니다.

## 4. 자발적 긍정 대처 (Alternative Coping) 자원 평가 및 서킷 브레이킹 전략
- **내담자 수용 긍정 대처**: **[${sPositiveCoping}]**
- **서킷 브레이킹 시점 (Disruption Point)**: 신체 반응 **[${sBody}]**이 감지되는 즉시, 표적 행동 **[${sAction}]**으로의 전이를 차단하기 위해 3분의 버퍼 타임을 확보하고 **[${sPositiveCoping}]**을 선행 실행하는 미세 행동 계약(Micro-Behavioral Activation)을 체결할 것을 권고합니다.

2. **인지적 탈융합(Defusion)**: 자동적 사고("${sThought}")를 절대적 진실이 아닌 '마음에 스쳐 지나가는 언어'로 분리하여 조망하는 인지 탈융합 기법 적용.
3. **대체 행동 강화**: [${sPositiveCoping}] 실천 시 획득되는 내적 성취감과 이완도를 매 회기 척도화(0~10점)하여 추적 관찰.`;

## 1. 다회기 상태 전이 네트워크 구조 및 핵심 기폭 노드(Ignition Node) 분석
내담자 [${selectedNickname} 님]의 개인 상태 전이 네트워크를 정밀 분석한 결과, 네트워크를 점화시키는 최대 출차수 기폭제(Ignition Node)는 **[${metrics.ignitionNode}]**이며, 주 취약 정서 및 신체 반응은 **[${metrics.topEmotion}]**과 **[${metrics.topBody}]**로 확인되었습니다.
- **중심 회피 허브 (Central Avoidance Hub)**: 내담자의 스트레스 연쇄는 높은 조건부 전이 확률로 중심 허브 행동인 **[${metrics.topBottleneck}]**(으)로 강력하게 수렴하고 있습니다.
- **최빈 전이 엣지 (Core Trajectory Pathway)**: **[${metrics.topTransition}]** 경로가 가장 높은 가중치(Edge Weight)를 기록하며 악순환의 메인 파이프라인 역할을 수행하고 있습니다.

## 2. 종단적 궤적(Longitudinal Trajectory) 및 행동 레퍼토리 변화 분석
- **회기별 적응적 진화 추이**: 누적 ${metrics.totalChains}회기의 시계열 데이터를 분석한 결과, 초기의 극단적 회피 중심 패턴에서 최근 회기로 갈수록 긍정 대처(**[${metrics.topPositiveCoping}]**)를 탐색하고 시도하려는 유의미한 행동 레퍼토리 확장이 관찰됩니다.
- **인지적 반추 패턴**: 주로 **"${metrics.topThought}"** 유형의 자기비하적·부정적 자동적 사고가 빈발하므로, 이에 대한 수용 및 인지적 유연성(Psychological Flexibility) 증진이 요구됩니다.
- **부적 강화 결과의 고착화**: 회피 행동 이후 지속되는 **[${metrics.topOutcome}]**은 내담자의 긍정적 자연 강화물(Natural Reinforcers) 접촉을 박탈하는 핵심 유지 기제로 작용하고 있습니다.

## 3. TRAP에서 TRAC 모델로의 전환 (Circuit-Breaking Strategy)
- **TRAP 패턴 규명**: Trigger(${metrics.topTrigger}) ➔ Response(${metrics.topEmotion}, ${metrics.topBody}) ➔ Avoidance Pattern(${metrics.topBottleneck})
- **TRAC 대안 경로 구축**: Trigger ➔ Response ➔ Alternative Coping(**${metrics.topPositiveCoping}**)
- **서킷 브레이킹 프로토콜**: 최빈 전이 엣지인 **[${metrics.topTransition}]**이 촉발되는 찰나의 순간에 감각 접촉(Sensory Grounding)과 **[${metrics.topPositiveCoping}]**을 연결하는 자극 통제(Stimulus Control) 전략을 배치합니다.

                              value={noteTitle}
                              onChange={(e) => setNoteTitle(e.target.value)}
                              className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-indigo-500 font-medium"
                            />

                            <textarea
                              rows={4}
                              placeholder="상담 회기 중 관찰된 행동 특성, 저항, 치료적 개입 내용, 숙제(긍정 대처 실천) 반응 등을 기록하세요..."
                              value={noteContent}
                              onChange={(e) => setNoteContent(e.target.value)}
                              className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white text-xs leading-relaxed focus:outline-none focus:border-indigo-500 font-mono"
                            />

                            <div className="flex justify-end">
                              <button
                                type="submit"
                                disabled={isSavingNote || !noteContent.trim()}
                                className="px-5 py-2 bg-emerald-700 hover:bg-emerald-600 disabled:bg-slate-800 text-white font-bold rounded-xl text-xs shadow touch-btn flex items-center gap-1.5 transition-all"
                              >
                                <span>📌</span>
                                <span>{isSavingNote ? '저장 중...' : '메모 등록 (클라우드 영구 보관)'}</span>
                              </button>
                            </div>
                          </form>
                        </div>

                        {/* 누적 메모 히스토리 타임라인 */}
                        <div className="space-y-3">
                          <div className="flex items-center justify-between px-1">
                            <span className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                              <span>📜</span>
                              <span>누적 임상 메모 히스토리 ({notes.length}건)</span>
                            </span>
                            <span className="text-[11px] text-slate-500">최신순 정렬</span>
                          </div>

                          {notes.length === 0 ? (
                            <div className="p-8 text-center bg-slate-900/50 rounded-2xl border border-slate-800 text-slate-500 text-xs">
                              아직 기록된 상담 메모가 없습니다. 위의 작성 폼에서 첫 회기 메모를 남겨보세요.
                            </div>
                          ) : (
                            <div className="space-y-2.5 max-h-[500px] overflow-y-auto pr-1">
                              {notes.map(n => (
                                <div
                                  key={n.id}
                                  className="p-4 bg-slate-900 rounded-2xl border border-slate-800 hover:border-slate-700 transition-all space-y-2 shadow-sm relative group"
                                >
                                  <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                      <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-950 border border-indigo-700 text-indigo-300">
                                        {n.category || '임상관찰'}
                                      </span>
                                      <strong className="text-white text-xs font-bold">{n.title}</strong>
                                    </div>
                                    <div className="flex items-center gap-2">
                                      <span className="text-[11px] font-mono text-slate-400">{n.date}</span>
                                      <button
                                        onClick={() => handleDeleteNote(n.id)}
                                        className="text-slate-500 hover:text-rose-400 text-xs p-1 opacity-60 group-hover:opacity-100 transition-opacity"
                                        title="메모 삭제"
                                      >
                                        🗑️
                                      </button>
                                    </div>
                                  </div>
                                  <p className="text-xs text-slate-300 leading-relaxed whitespace-pre-wrap font-mono">
                                    {n.content}
                                  </p>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>
          </div>

          {/* Firebase 클라우드 영구 DB 설정 모달 */}
          {showDbModal && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl p-6 sm:p-7 max-w-xl w-full shadow-2xl space-y-5 text-slate-200">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2.5">
                    <span className="text-2xl">☁️</span>
                    <div>
                      <h3 className="text-lg font-black text-white">Firebase 클라우드 영구 DB 연동</h3>
                      <p className="text-xs text-slate-400">내담자(스마트폰/PC)와 상담자 간 실시간 원격 데이터 동기화</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowDbModal(false)}
                    className="text-slate-400 hover:text-white text-xl p-1 font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* 연결 상태 표시 */}
                <div className={`p-3 rounded-2xl border text-xs flex items-center justify-between ${
                  dbStatus.isCloud
                    ? 'bg-emerald-950/60 border-emerald-800 text-emerald-300'
                    : 'bg-amber-950/60 border-amber-800 text-amber-300'
                }`}>
                  <div className="flex items-center gap-2">
                    <span className="text-base">{dbStatus.isCloud ? '🟢' : '🟡'}</span>
                    <div>
                      <strong className="block font-bold">{dbStatus.label}</strong>
                      <span className="text-[11px] opacity-80">
                        {dbStatus.isCloud
                          ? '내담자가 제출하는 설문이 실시간으로 이 화면에 즉각 수신됩니다.'
                          : '현재는 이 브라우저에만 데이터가 저장됩니다. 원격 접속을 위해 Firebase를 연동하세요.'}
                      </span>
                    </div>
                  </div>
                </div>

                {/* 설정 입력 영역 */}
                <div className="space-y-2">
                  <div className="flex items-center justify-between">
                    <label className="text-xs font-bold text-slate-300">
                      Firebase Web App Config (JSON 형태)
                    </label>
                    <span className="text-[11px] text-indigo-400">firebaseConfig 객체 복사 붙여넣기</span>
                  </div>
                  <textarea
                    rows={6}
                    value={configInput}
                    onChange={(e) => setConfigInput(e.target.value)}
                    placeholder={`{\n  "apiKey": "AIzaSy...",\n  "authDomain": "your-app.firebaseapp.com",\n  "projectId": "your-app",\n  "storageBucket": "your-app.appspot.com",\n  "messagingSenderId": "123456789",\n  "appId": "1:123:web:abc"\n}`}
                    className="w-full bg-slate-950 border border-slate-700 rounded-2xl p-3 text-xs font-mono text-indigo-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                  />
                  <p className="text-[11px] text-slate-400 leading-relaxed">
                    💡 <strong>firebase-config.js</strong> 파일을 직접 수정하시거나, 여기에 복사한 JSON을 넣고 [저장 및 연결]을 누르면 즉시 연동됩니다.
                  </p>
                </div>

                {/* 상태 메시지 */}
                {dbMessage && (
                  <div className="p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-indigo-300 font-medium">
                    {dbMessage}
                  </div>
                )}

                {/* 연결 테스트 및 내담자 링크 안내 */}
                <div className="flex flex-wrap gap-2 pt-1">
                  <button
                    onClick={handleTestConnection}
                    disabled={isTesting}
                    className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 touch-btn"
                  >
                    <span>{isTesting ? '⏳' : '🔍'}</span>
                    <span>{isTesting ? '테스트 진행 중...' : '클라우드 DB 연결 & 권한 테스트'}</span>
                  </button>
                  <button
                    onClick={handleCopyClientUrl}
                    className="py-2 px-3 bg-indigo-950/70 hover:bg-indigo-900 text-indigo-200 border border-indigo-700 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 touch-btn"
                    title="내담자 스마트폰으로 보낼 원클릭 링크를 복사합니다"
                  >
                    <span>📱</span>
                    <span>내담자 링크 복사</span>
                  </button>
                </div>

                {/* 로컬 데이터 마이그레이션 안내 및 실행 */}
                <div className="p-3 bg-slate-950/70 border border-slate-800 rounded-2xl space-y-2">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-slate-300">📦 기존 로컬 데이터 이전</span>
                    <button
                      onClick={handleMigrate}
                      className="px-3 py-1.5 bg-indigo-700 hover:bg-indigo-600 text-white rounded-xl text-xs font-bold touch-btn shadow flex items-center gap-1"
                    >
                      <span>🚀</span> 클라우드로 일괄 업로드
                    </button>
                  </div>
                  <p className="text-[11px] text-slate-400">
                    현재 브라우저에 임시 저장되어 있는 설문 데이터를 새로 연결된 Firebase Firestore로 한 번에 보냅니다.
                  </p>
                </div>

                {/* 모달 하단 버튼 */}
                <div className="flex items-center justify-between pt-2 border-t border-slate-800">
                  <button
                    onClick={handleResetConfig}
                    className="px-3 py-2 text-rose-400 hover:text-rose-300 hover:bg-rose-950/50 rounded-xl text-xs font-bold"
                  >
                    설정 초기화 (로컬 모드로 복구)
                  </button>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setShowDbModal(false)}
                      className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold"
                    >
                      닫기
                    </button>
                    <button
                      onClick={handleSaveConfig}
                      className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-600/30 touch-btn"
                    >
                      저장 및 연결 ➔
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 🔔 실시간 내담자 설문 도착 토스트 알림 */}
          {newArrivalAlert && (
            <div className="fixed bottom-6 right-6 z-50 animate-bounce">
              <div className="bg-indigo-600 text-white px-5 py-4 rounded-2xl shadow-2xl border-2 border-indigo-400 flex items-center gap-3">
                <span className="text-2xl">🔔</span>
                <div
                  className="cursor-pointer"
                  onClick={() => {
                    setSelectedNickname(newArrivalAlert.nickname);
                    setSelectedSessionId(newArrivalAlert.id);
                    setNewArrivalAlert(null);
                  }}
                  title="클릭 시 해당 내담자의 개인 전이도 및 소견서로 바로 이동"
                >
                  <div className="font-extrabold text-sm flex items-center gap-1.5">
                    <span>새로운 마음 설문이 도착했습니다!</span>
                    <span className="text-xs bg-indigo-800 px-2 py-0.5 rounded-full">{newArrivalAlert.time}</span>
                  </div>
                  <div className="text-xs text-indigo-100 mt-0.5">
                    내담자: <strong className="text-amber-300 font-bold">{newArrivalAlert.nickname}</strong>님의 데이터로 즉시 이동 (클릭)
                  </div>
                </div>
                <button
                  onClick={() => setNewArrivalAlert(null)}
                  className="ml-2 text-indigo-200 hover:text-white text-base font-black"
                >
                  ✕
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<AdminApp />, document.getElementById('root'));
  </script>
</body>
</html>
