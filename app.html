          const key = getPresetStorageKey();
          const saved = localStorage.getItem(key);
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      // 번호 또는 닉네임 변경 시 해당 사용자의 맞춤 답변 목록 다시 로드
      useEffect(() => {
        try {
          const key = getPresetStorageKey(clientCode, nickname);
          const saved = localStorage.getItem(key);
          setCustomPresets(saved ? JSON.parse(saved) : {});
        } catch (e) {
          setCustomPresets({});
        }
      }, [clientCode, nickname]);

      // 저장된 과거 체인 기록(chains)에서 PRESETS에 없는 커스텀 입력값을 찾아 자동 병합 (기기 변경/캐시 삭제 복구)
      useEffect(() => {
        if (!chains || chains.length === 0) return;
        const myChains = clientCode
          ? chains.filter(c => c.clientCode === clientCode)
          : (nickname ? chains.filter(c => c.nickname === nickname) : chains);
        if (myChains.length === 0) return;

        setCustomPresets(prev => {
          let hasChange = false;
          const nextPresets = { ...prev };

          myChains.forEach(chain => {
            if (!Array.isArray(chain.sequence)) return;
            chain.sequence.forEach((item, idx) => {
              const step = idx + 1;
              if (!item || !item.label) return;
              const cleanLabel = item.label.trim();
              if (!cleanLabel) return;

              // 표준 PRESETS에 있는지 확인 (이모지 제외 순수 텍스트 비교)
              const standardList = PRESETS[step] || [];
              const isStandard = standardList.some(std => {
                const cleanStd = std.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim();
                return cleanStd === cleanLabel || std === cleanLabel;
              });

              if (!isStandard) {
                if (!nextPresets[step]) nextPresets[step] = [];
                if (!nextPresets[step].includes(cleanLabel)) {
                  nextPresets[step] = [...nextPresets[step], cleanLabel];
                  hasChange = true;
                }
              }
            });
          });

          if (hasChange) {
            try {
              const key = getPresetStorageKey(clientCode, nickname);
              localStorage.setItem(key, JSON.stringify(nextPresets));
            } catch (e) {}
            return nextPresets;
          }
          return prev;
        });
      }, [chains, clientCode, nickname]);

      // 맞춤 답변 추가 함수
      const addCustomPreset = (step, text) => {
        const clean = text.trim();
        if (!clean) return;

        // 표준 PRESETS에 이미 있는 문구인지 확인
        const standardList = PRESETS[step] || [];
        const isStandard = standardList.some(std => {
          const cleanStd = std.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim();
          return cleanStd === clean || std === clean;
        });
        if (isStandard) return;

        setCustomPresets(prev => {
          const currentList = prev[step] || [];
          if (currentList.includes(clean)) return prev;
          const updated = { ...prev, [step]: [...currentList, clean] };
          try {
            const key = getPresetStorageKey(clientCode, nickname);
            localStorage.setItem(key, JSON.stringify(updated));
          } catch (e) {}
          return updated;
        });
      };

      // 맞춤 답변 삭제 함수
      const removeCustomPreset = (step, textToRemove, e) => {
        if (e) e.stopPropagation();
        if (!confirm(`'${textToRemove}' 항목을 내 맞춤 목록에서 삭제하시겠습니까?`)) return;

        setCustomPresets(prev => {
          const currentList = prev[step] || [];
          const updated = { ...prev, [step]: currentList.filter(item => item !== textToRemove) };
          try {
            const key = getPresetStorageKey(clientCode, nickname);
            localStorage.setItem(key, JSON.stringify(updated));
          } catch (err) {}
          return updated;
        });

        // 현재 선택되어 있다면 선택 해제
        if (selectedAnswers[step] === textToRemove) {
          setSelectedAnswers(prev => {
            const copy = { ...prev };
            delete copy[step];
            return copy;
          });
        }
      };

      // 실시간 데이터 구독 (Firestore 연동 시 내담자 본인의 기록 실시간 동기화 - 번호 우선 매칭)
      useEffect(() => {
        if (!window.MindDB || typeof window.MindDB.subscribe !== 'function') return;
        const unsubscribe = window.MindDB.subscribe((saved) => {
          if (saved && saved.length > 0) {
            // 내담자 번호가 있으면 번호로 엄격히 격리, 없을 때만 닉네임으로 필터링
            const myChains = clientCode
              ? saved.filter(item => item.clientCode === clientCode)
              : (nickname ? saved.filter(item => item.nickname === nickname) : saved);
            setChains(myChains.length > 0 ? myChains : INITIAL_CHAINS);
          } else {
            setChains(INITIAL_CHAINS);
          }
          if (window.MindDB && typeof window.MindDB.getStatus === 'function') {
            setDbStatus(window.MindDB.getStatus());
          }
        }, (err) => {
          console.warn("DB 실시간 구독 에러:", err);
          if (window.MindDB && typeof window.MindDB.getStatus === 'function') {
            setDbStatus(window.MindDB.getStatus());
          }
        }, clientCode ? `code:${clientCode}` : (nickname || null));

        return () => {
          if (typeof unsubscribe === 'function') unsubscribe();
        };
      }, [clientCode, nickname]);

      // 내담자 닉네임 저장 핸들러 (내담자는 닉네임만 설정, 식별 번호는 상담사 부여 링크로 자동 각인된 코드 유지)
      const handleSaveNickname = (name) => {
        const trimmedNick = (name !== undefined ? name : inputNick).trim();
        if (!trimmedNick) {
          alert("편하게 부르실 수 있는 닉네임을 적어주세요 😊");
          return;
        }
        setNickname(trimmedNick);
        try {
          localStorage.setItem('mind_user_nickname', trimmedNick);
        } catch (e) {}
        setShowNicknameModal(false);
      };

      const handleSelectOption = (optionText) => {
        setSelectedAnswers(prev => ({ ...prev, [currentStep]: optionText }));
      };

      const handleNext = () => {
        const trimmedCustom = customInput.trim();
        if (!selectedAnswers[currentStep] && !trimmedCustom) {
          alert("마음에 드는 항목을 하나 콕 눌러주시거나, 아래에 적어주세요 😊");
          return;
        }

        let updatedAnswers = { ...selectedAnswers };
        if (trimmedCustom) {
          updatedAnswers[currentStep] = trimmedCustom;
          setSelectedAnswers(updatedAnswers);
          addCustomPreset(currentStep, trimmedCustom);
          setCustomInput('');
        }

        if (currentStep < 8) {
          setCurrentStep(prev => prev + 1);
        } else {
          saveChain(updatedAnswers);
        }
      };

      // 8단계 설문 저장 핸들러 (내담자 번호, 닉네임, 복합 고유키 영구 저장)
      const saveChain = async (finalAnswers = selectedAnswers) => {
        const types = ['컨디션', '계기', '생각', '감정', '몸느낌', '행동', '결과', '긍정대처'];
        const newSeq = types.map((typeName, idx) => ({
          type: typeName,
          label: (finalAnswers[idx + 1] || '').replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim()
        }));

        const now = new Date();
        const pad = (n) => n.toString().padStart(2, '0');
        const dateStr = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

        const newEntry = {
          id: Date.now(),
          clientCode: clientCode || '',
          nickname: nickname || "익명",
          userKey: clientCode ? `[${clientCode}] ${nickname || '익명'}` : (nickname || "익명"),
          date: dateStr,
          createdAt: now.toISOString(),
          sequence: newSeq
        };

        let result = { mode: 'local' };
        try {
          if (window.MindDB && typeof window.MindDB.save === 'function') {
            result = await window.MindDB.save(newEntry);
          }
        } catch (e) {
          console.warn("기록 저장 중 경고 (로컬 보관):", e);
        }
        setChains(prev => [newEntry, ...prev.filter(item => item.id !== newEntry.id)]);

        const syncNotice = result.mode === 'firestore'
          ? "☁️ 상담자 연구실로 실시간 안전하게 전송되었습니다."
          : "💾 내 브라우저에 안전하게 보관되었습니다.";

        const dispName = clientCode ? `[${clientCode}] ${nickname || '선생'}님` : `${nickname || '선생'}님`;
        alert(`참 잘하셨습니다, ${dispName}! 🌻\n소중한 마음 기록과 긍정 대처가 저장되었습니다.\n(${syncNotice})\n내 마음 행동 지도로 안내해 드립니다.`);
        setCurrentStep(1);
        setSelectedAnswers({});
        setCustomInput('');
        setTab('network');
      };

      // Firebase 설정 저장/초기화 핸들러
      const handleSaveConfig = () => {
        try {
          const parsed = JSON.parse(configInput);
          if (!parsed.apiKey || !parsed.projectId) {
            alert("apiKey와 projectId는 필수 항목입니다.");
            return;
          }
          if (window.MindDB && typeof window.MindDB.saveConfig === 'function') {
            const res = window.MindDB.saveConfig(parsed);
            if (res.success) {
              alert("Firebase 클라우드 DB가 성공적으로 연결되었습니다!");
              setShowDbModal(false);
              setDbStatus(window.MindDB.getStatus());
            } else {
              alert("Firebase 연결 실패: " + (res.error || '설정값을 확인하세요.'));
            }
          }
        } catch (e) {
          alert("JSON 형식이 올바르지 않습니다.");
        }
      };

      const handleResetConfig = () => {
        if (confirm("Firebase 설정을 제거하고 로컬 브라우저 모드로 전환하시겠습니까?")) {
          if (window.MindDB && typeof window.MindDB.resetConfig === 'function') {
            window.MindDB.resetConfig();
            setDbStatus(window.MindDB.getStatus());
          }
          setShowDbModal(false);
        }
      };

      return (
        <div className="max-w-xl mx-auto px-4 py-6 min-h-screen flex flex-col justify-between">
          <header className="mb-4">
            <div className="flex items-center justify-between bg-white/80 backdrop-blur-sm p-3.5 rounded-2xl shadow-sm border border-amber-200/60">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🌻</span>
                <div>
                  <h1 className="text-base font-black text-amber-950 tracking-tight leading-tight">마음 돋보기</h1>
                  <span className="text-[11px] font-bold text-amber-800/80">내 마음 행동 활성화 체인</span>
                </div>
              </div>

              {/* 닉네임 & 클라우드 상태 */}
              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => {
                    const currentCfg = (window.MindDB && typeof window.MindDB.getConfig === 'function')
                      ? window.MindDB.getConfig()
                      : null;
                    setConfigInput(currentCfg ? JSON.stringify(currentCfg, null, 2) : '');
                    setShowDbModal(true);
                  }}
                  className={`px-2.5 py-1 rounded-full text-[11px] font-extrabold flex items-center gap-1 shadow-sm touch-btn border ${
                    dbStatus.isCloud
                      ? 'bg-emerald-100 border-emerald-300 text-emerald-800'
                      : 'bg-amber-200/80 border-amber-300 text-amber-800'
                  }`}
                  title="클라우드 DB 실시간 연결 상태"
                >
                  <span>{dbStatus.isCloud ? '🟢' : '🟡'}</span>
                  <span>{dbStatus.isCloud ? '실시간 동기화' : '로컬 모드'}</span>
                </button>

                <button
                  onClick={() => {
                    setInputNick(nickname);
                    setShowNicknameModal(true);
                  }}
                  className="px-3 py-1 bg-amber-200 hover:bg-amber-300 text-amber-950 rounded-full text-xs font-extrabold flex items-center gap-1.5 shadow-sm touch-btn"
                  title="내 닉네임 설정"
                >
                  <span>👤</span>
                  {clientCode && (
                    <span className="px-1.5 py-0.5 bg-amber-700 text-white rounded-md text-[10px] font-black tracking-wider">
                      {clientCode}
                    </span>
                  )}
                  <span>{nickname ? `${nickname}님` : '내 정보 등록'}</span>
                  <span className="text-[10px] text-amber-700">✏️</span>
                </button>
              </div>
            </div>

            {/* 3가지 탭 메뉴 (내담자 전용) */}
            <nav className="flex gap-2 mt-5">
              <button
                onClick={() => setTab('wizard')}
                className={`flex-1 py-3 text-base sm:text-lg font-bold rounded-2xl touch-btn shadow-sm flex items-center justify-center gap-1.5 ${
                  tab === 'wizard' ? 'bg-amber-600 text-white shadow-md' : 'bg-white/80 text-amber-900 hover:bg-white'
                }`}
              >
                <span>✏️</span> 기록하기
              </button>
              <button
                onClick={() => setTab('network')}
                className={`flex-1 py-3 text-base sm:text-lg font-bold rounded-2xl touch-btn shadow-sm flex items-center justify-center gap-1.5 ${
                  tab === 'network' ? 'bg-amber-600 text-white shadow-md' : 'bg-white/80 text-amber-900 hover:bg-white'
                }`}
              >
                <span>🕸️</span> 행동 지도
              </button>
              <button
                onClick={() => setTab('aiReport')}
                className={`flex-1 py-3 text-base sm:text-lg font-bold rounded-2xl touch-btn shadow-sm flex items-center justify-center gap-1.5 ${
                  tab === 'aiReport' ? 'bg-amber-600 text-white shadow-md' : 'bg-white/80 text-amber-900 hover:bg-white'
                }`}
              >
                <span>💌</span> 마음 분석 편지
              </button>
            </nav>
          </header>

          {/* 메인 뷰 */}
          <main className="flex-1 p-6 flex flex-col">
            {tab === 'wizard' && (
              <div className="flex-1 flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-sm font-extrabold text-amber-800 bg-amber-100 px-3.5 py-1.5 rounded-full">
                      {currentStep}단계 / 총 8단계 {currentStep === 8 && "🌟 (회복과 긍정 대처)"}
                    </span>
                    <span className="text-sm text-slate-500 font-medium">나에게 가장 가까운 느낌을 편안하게 골라보세요</span>
                  </div>

                  <div className="w-full bg-amber-100 h-3.5 rounded-full overflow-hidden mb-6">
                    <div
                      className={`h-full rounded-full transition-all duration-300 ${currentStep === 8 ? 'bg-emerald-500' : 'bg-amber-500'}`}
                      style={{ width: `${(currentStep / 8) * 100}%` }}
                    ></div>
                  </div>

                  <div className={`p-5 rounded-3xl border mb-5 ${
                    currentStep === 8 
                      ? 'bg-emerald-50/80 border-emerald-300' 
                      : 'bg-amber-50/70 border-amber-200'
                  }`}>
                    <div className="flex items-center gap-3 mb-2">
                      <span className="text-4xl">{STEP_INFO[currentStep - 1].icon}</span>
                      <h2 className={`text-2xl font-extrabold ${currentStep === 8 ? 'text-emerald-950' : 'text-slate-900'}`}>
                        {STEP_INFO[currentStep - 1].title}
                      </h2>
                    </div>
                    <p className="text-lg font-medium text-slate-700 leading-relaxed">
                      {STEP_INFO[currentStep - 1].desc}
                    </p>
                  </div>

                  {/* 이전에 직접 적으셨던 맞춤 답변이 있을 경우 상단에 우선 노출 */}
                  {customPresets[currentStep] && customPresets[currentStep].length > 0 && (
                    <div className="mb-5 p-4 rounded-2xl bg-amber-100/70 border-2 border-amber-300 shadow-sm animate-fadeIn">
                      <div className="flex items-center justify-between mb-3">
                        <div className="flex items-center gap-1.5 font-extrabold text-amber-950 text-base">
                          <span className="text-xl">⭐</span>
                          <span>{nickname ? `${nickname}님이 이전에 직접 적으셨던 답변` : '이전에 직접 적으셨던 맞춤 답변'}</span>
                        </div>
                        <span className="text-xs font-bold text-amber-800 bg-amber-200/90 px-2.5 py-1 rounded-full">
                          나만의 표현
                        </span>
                      </div>
                      <div className="grid grid-cols-1 gap-2.5">
                        {customPresets[currentStep].map((opt, i) => {
                          const isSelected = selectedAnswers[currentStep] === opt;
                          return (
                            <div
                              key={`custom-${i}`}
                              onClick={() => handleSelectOption(opt)}
                              className={`w-full min-h-[60px] py-3.5 px-4 rounded-2xl text-left font-bold text-lg border-2 touch-btn flex items-center justify-between cursor-pointer transition-all ${
                                isSelected
                                  ? (currentStep === 8 
                                      ? 'bg-emerald-600 text-white border-emerald-700 shadow-md scale-[1.01]' 
                                      : 'bg-amber-600 text-white border-amber-700 shadow-md scale-[1.01]')
                                  : 'bg-white text-slate-800 border-amber-200 hover:border-amber-400 hover:bg-amber-50'
                              }`}
                            >
                              <div className="flex items-center gap-2.5 pr-2 overflow-hidden">
                                <span className="text-xl shrink-0">✍️</span>
                                <span className="break-words leading-snug">{opt}</span>
                              </div>
                              <div className="flex items-center gap-2 shrink-0">
                                {isSelected && <span className="text-2xl">✔️</span>}
                                <button
                                  type="button"
                                  onClick={(e) => removeCustomPreset(currentStep, opt, e)}
                                  title="이 맞춤 답변 삭제"
                                  className={`p-1.5 rounded-lg text-sm touch-btn transition-colors ${
                                    isSelected 
                                      ? 'text-amber-200 hover:text-white hover:bg-amber-700/60' 
                                      : 'text-slate-400 hover:text-rose-600 hover:bg-rose-50'
                                  }`}
                                >
                                  🗑️
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {/* 자주 쓰는 기본 예시 헤더 */}
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-bold text-slate-500">💡 자주 쓰는 기본 예시</span>
                  </div>

                  <div className="grid grid-cols-1 gap-3 mb-5">
                    {PRESETS[currentStep]?.map((opt, i) => {
                      const isSelected = selectedAnswers[currentStep] === opt;
                      return (
                        <button
                          key={i}
                          onClick={() => handleSelectOption(opt)}
                          className={`w-full min-h-[64px] py-4 px-5 rounded-2xl text-left font-bold text-lg sm:text-xl border-2 touch-btn flex items-center justify-between ${
                            isSelected
                              ? (currentStep === 8 
                                  ? 'bg-emerald-600 text-white border-emerald-700 shadow-md scale-[1.01]' 
                                  : 'bg-amber-500 text-white border-amber-600 shadow-md scale-[1.01]')
                              : 'bg-white text-slate-800 border-slate-200 hover:border-amber-300 hover:bg-amber-50/40'
                          }`}
                        >
                          <span>{opt}</span>
                          {isSelected && <span className="text-2xl">✔️</span>}
                        </button>
                      );
                    })}
                  </div>

                  <div className="mb-4">
                    <label className="block text-sm font-bold text-slate-600 mb-1.5">
                      ✍️ 찾으시는 내용이 없나요? 편하게 적어주시면 다음에도 기억해 둘게요:
                    </label>
                    <input
                      type="text"
                      value={customInput}
                      onChange={(e) => setCustomInput(e.target.value)}
                      placeholder={currentStep === 8 ? "예: 좋아하는 화분에 물 주기, 반려견 쓰다듬기..." : "예: 이웃과 마주쳤을 때..."}
                      className="w-full text-base sm:text-lg border-2 border-slate-200 rounded-2xl p-4 focus:border-amber-500 focus:outline-none bg-white"
                    />
                  </div>
                </div>

                <div className="flex gap-3 pt-4 border-t border-slate-200 mt-6">
                  {currentStep > 1 && (
                    <button
                      onClick={() => setCurrentStep(prev => prev - 1)}
                      className="flex-1 py-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-lg rounded-2xl touch-btn"
                    >
                      ⬅️ 이전으로
                    </button>
                  )}
                  <button
                    onClick={handleNext}
                    className={`flex-[2] py-4 text-white font-extrabold text-xl rounded-2xl shadow-lg touch-btn ${
                      currentStep === 8 
                        ? 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/30' 
                        : 'bg-amber-600 hover:bg-amber-700 shadow-amber-600/30'
                    }`}
                  >
                    {currentStep === 8 ? "✨ 다 적었어요 (저장하기)" : "다음으로 ➡️"}
                  </button>
                </div>
              </div>
            )}

            {tab === 'network' && (
              <NetworkView chains={chains} onGoWizard={() => setTab('wizard')} onGoReport={() => setTab('aiReport')} />
            )}

            {tab === 'aiReport' && (
              <ClientAIReportView chains={chains} nickname={nickname} />
            )}
          </main>

          {/* 내담자 닉네임 설정 모달 (식별 번호 직접 입력 제거, 상담사 링크 각인 번호는 읽기 전용 뱃지 표시) */}
          {showNicknameModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
              <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl border-4 border-amber-400 space-y-4">
                <div className="text-center space-y-1.5">
                  <span className="text-4xl inline-block">🌻</span>
                  <h3 className="text-2xl font-black text-amber-950">마음 돋보기에 오신 것을 환영합니다</h3>
                  <p className="text-xs sm:text-sm font-medium text-slate-600 leading-relaxed">
                    선생님을 어떻게 불러드리면 좋을까요?<br/>
                    한번 저장해 두시면 다음 접속부터는 다시 묻지 않습니다 😊
                  </p>
                </div>

                {/* 상담사 초대 링크에서 각인된 고유 번호가 있을 때 안내 뱃지 */}
                {clientCode ? (
                  <div className="bg-emerald-50 border border-emerald-300 rounded-2xl p-3 flex items-center gap-2.5">
                    <span className="text-2xl">🎫</span>
                    <div className="text-xs">
                      <div className="font-extrabold text-emerald-900">
                        상담사 지정 식별 번호: <span className="font-mono text-sm px-2 py-0.5 bg-emerald-200 text-emerald-950 rounded-md font-black">[{clientCode}]</span>
                      </div>
                      <div className="text-emerald-700 text-[11px] mt-0.5">
                        상담사 전용 링크로 안전하게 연결되어 기록이 보호됩니다.
                      </div>
                    </div>
                  </div>
                ) : null}

                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-amber-900 mb-1">내 닉네임 (별명) *</label>
                    <input
                      type="text"
                      value={inputNick}
                      onChange={(e) => setInputNick(e.target.value)}
                      placeholder="예: 행복한 해바라기, 맑은 하늘, 솔바람..."
                      onKeyDown={(e) => { if (e.key === 'Enter') handleSaveNickname(inputNick); }}
                      className="w-full text-base border-2 border-amber-300 rounded-2xl p-3 focus:border-amber-600 focus:outline-none"
                      autoFocus
                    />
                  </div>

                  <div>
                    <span className="text-xs font-bold text-slate-400 block mb-1">추천 별명 (눌러서 선택):</span>
                    <div className="flex flex-wrap gap-1.5">
                      {["행복한 해바라기 🌻", "맑은 하늘 ☀️", "푸른 소나무 🌲", "은빛나래 🕊️", "따뜻한 차 한 잔 🍵"].map((tag, idx) => (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => setInputNick(tag.split(' ')[0])}
                          className="text-xs px-2.5 py-1 bg-amber-50 hover:bg-amber-100 text-amber-900 rounded-xl border border-amber-200 font-bold touch-btn"
                        >
                          {tag}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  {nickname && (
                    <button
                      type="button"
                      onClick={() => setShowNicknameModal(false)}
                      className="flex-1 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-2xl touch-btn text-sm"
                    >
                      취소
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => handleSaveNickname(inputNick)}
                    className="flex-[2] py-3 bg-amber-600 hover:bg-amber-700 text-white font-extrabold rounded-2xl shadow-md text-base touch-btn"
                  >
                    마음 돋보기 시작하기 🚀
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Firebase 클라우드 영구 DB 설정 모달 */}
          {showDbModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
              <div className="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl border-4 border-indigo-400 space-y-4">
                <div className="flex items-center justify-between border-b pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">☁️</span>
                    <div>
                      <h3 className="text-lg font-black text-slate-900">클라우드 영구 DB 동기화 설정</h3>
                      <p className="text-xs text-slate-500">스마트폰이나 다른 기기에서도 내 기록과 연결됩니다</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowDbModal(false)}
                    className="text-slate-400 hover:text-slate-700 text-xl font-bold p-1"
                  >
                    ✕
                  </button>
                </div>

                {/* 현재 상태 */}
                <div className={`p-3 rounded-2xl border text-xs flex items-center gap-2.5 ${
                  dbStatus.isCloud
                    ? 'bg-emerald-50 border-emerald-300 text-emerald-900'
                    : 'bg-amber-50 border-amber-300 text-amber-900'
                }`}>
                  <span className="text-xl">{dbStatus.isCloud ? '🟢' : '🟡'}</span>
                  <div>
                    <strong className="block font-bold">{dbStatus.label}</strong>
                    <span className="text-[11px] opacity-80">
                      {dbStatus.isCloud
                        ? '제출하신 설문이 연구자·상담자에게 실시간으로 안전하게 전송됩니다.'
                        : '현재 브라우저에만 저장되고 있습니다. 원격 연동을 위해 Firebase 설정을 입력하세요.'}
                    </span>
                  </div>
                </div>

                {/* 설정 입력창 */}
                <div className="space-y-1.5">
                  <div className="flex justify-between items-center">
                    <label className="text-xs font-bold text-slate-700">Firebase Config (JSON 붙여넣기)</label>
                    <span className="text-[11px] text-indigo-600 font-semibold">관리자/상담자에게 받은 키 입력</span>
                  </div>
                  <textarea
                    rows={5}
                    value={configInput}
                    onChange={(e) => setConfigInput(e.target.value)}
                    placeholder={`{\n  "apiKey": "...",\n  "projectId": "..."\n}`}
                    className="w-full border-2 border-slate-300 rounded-2xl p-3 text-xs font-mono text-slate-800 focus:outline-none focus:border-indigo-500"
                  />
                  <p className="text-[11px] text-slate-500">
                    💡 상담자로부터 전달받은 Firebase 설정 JSON을 붙여넣으시면 즉시 연결됩니다.
                  </p>
                </div>

                <div className="flex items-center justify-between pt-2 border-t">
                  <button
                    onClick={handleResetConfig}
                    className="text-xs text-rose-600 hover:underline font-bold"
                  >
                    설정 초기화 (로컬 모드)
                  </button>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setShowDbModal(false)}
                      className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl text-xs font-bold"
                    >
                      닫기
                    </button>
                    <button
                      onClick={handleSaveConfig}
                      className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow touch-btn"
                    >
                      저장 및 동기화 ➔
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 네트워크 행동 지도 뷰 (내담자용)
    // ==========================================
    function NetworkView({ chains, onGoWizard, onGoReport }) {
      const svgRef = useRef(null);
      const modalSvgRef = useRef(null);
      const zoomBehaviorRef = useRef(null);

      const [hubInfo, setHubInfo] = useState({ label: '', count: 0 });
      const [isFullScreen, setIsFullScreen] = useState(false);
      const [viewType, setViewType] = useState('graph');
      const [selectedNode, setSelectedNode] = useState(null);

      const prepareGraphData = () => {
        const nodeMap = new Map();
        const edgeMap = new Map();

        chains.forEach(c => {
          const seq = c.sequence;
          for (let i = 0; i < seq.length; i++) {
            const cur = seq[i];
            const id = cur.label;
            if (!nodeMap.has(id)) {
              nodeMap.set(id, { id, label: cur.label, type: cur.type, count: 1 });
            } else {
              nodeMap.get(id).count += 1;
            }

            if (i < seq.length - 1) {
              const next = seq[i + 1];
              const edgeKey = `${id}->${next.label}`;
              if (!edgeMap.has(edgeKey)) {
                edgeMap.set(edgeKey, { source: id, target: next.label, weight: 1 });
              } else {
                edgeMap.get(edgeKey).weight += 1;
              }
            }
          }
        });

        return { nodes: Array.from(nodeMap.values()), edges: Array.from(edgeMap.values()) };
      };

      const renderD3 = (targetSvg, isModal = false) => {
        if (!targetSvg) return;
        const { nodes, edges } = prepareGraphData();
        const sorted = [...nodes].filter(n => n.type !== '긍정대처').sort((a, b) => b.count - a.count);
        if (sorted.length > 0) setHubInfo({ label: sorted[0].label, count: sorted[0].count });

        const rect = targetSvg.getBoundingClientRect();
        const width = (rect && rect.width > 50) ? rect.width : (targetSvg.clientWidth || (isModal ? 800 : 500));
        const height = (rect && rect.height > 50) ? rect.height : (isModal ? 540 : 360);

        d3.select(targetSvg).selectAll("*").remove();
        const svg = d3.select(targetSvg).attr("viewBox", [0, 0, width, height]);
        const g = svg.append("g");

        const zoom = d3.zoom().scaleExtent([0.4, 3.5]).on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);
        zoomBehaviorRef.current = { zoom, svg };

        svg.append("defs").append("marker")
          .attr("id", isModal ? "arrow-m" : "arrow")
          .attr("viewBox", "0 -5 10 10").attr("refX", isModal ? 36 : 30).attr("refY", 0)
          .attr("markerWidth", isModal ? 9 : 8).attr("markerHeight", isModal ? 9 : 8).attr("orient", "auto")
          .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "#F59E0B");

        svg.append("defs").append("marker")
          .attr("id", isModal ? "arrow-green-m" : "arrow-green")
          .attr("viewBox", "0 -5 10 10").attr("refX", isModal ? 36 : 30).attr("refY", 0)
          .attr("markerWidth", isModal ? 9 : 8).attr("markerHeight", isModal ? 9 : 8).attr("orient", "auto")
          .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "#10B981");

        const simulation = d3.forceSimulation(nodes)
          .force("link", d3.forceLink(edges).id(d => d.id).distance(isModal ? 160 : 120))
          .force("charge", d3.forceManyBody().strength(isModal ? -550 : -380))
          .force("center", d3.forceCenter(width / 2, height / 2))
          .force("collision", d3.forceCollide().radius(isModal ? 70 : 52));

        const link = g.append("g").selectAll("line").data(edges).join("line")
          .attr("stroke", d => {
            const targetId = typeof d.target === 'object' ? d.target.id : d.target;
            const targetNode = nodes.find(n => n.id === targetId);
            return (targetNode && targetNode.type === '긍정대처') ? "#10B981" : "#FBBF24";
          })
          .attr("stroke-width", d => (isModal ? 4 : 3) + d.weight * 2.5)
          .attr("stroke-opacity", 0.9)
          .attr("stroke-dasharray", d => {
            const targetId = typeof d.target === 'object' ? d.target.id : d.target;
            const targetNode = nodes.find(n => n.id === targetId);
            return (targetNode && targetNode.type === '긍정대처') ? "6,3" : "none";
          })
          .attr("marker-end", d => {
            const targetId = typeof d.target === 'object' ? d.target.id : d.target;
            const targetNode = nodes.find(n => n.id === targetId);
            if (targetNode && targetNode.type === '긍정대처') {
              return `url(#${isModal ? 'arrow-green-m' : 'arrow-green'})`;
            }
            return `url(#${isModal ? 'arrow-m' : 'arrow'})`;
          });

        const node = g.append("g").selectAll("g").data(nodes).join("g").style("cursor", "pointer")
          .on("click", (e, d) => setSelectedNode(d))
          .call(d3.drag()
            .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
            .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
            .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

        const baseRadius = isModal ? 36 : 26;
        node.append("circle")
          .attr("r", d => baseRadius + d.count * (isModal ? 8 : 6))
          .attr("fill", d => {
            if (d.type === '긍정대처') return '#10B981';
            return d.count > 1 ? "#F59E0B" : "#FEF3C7";
          })
          .attr("stroke", d => d.type === '긍정대처' ? '#047857' : '#D97706')
          .attr("stroke-width", isModal ? 4 : 3.5)
          .attr("filter", "drop-shadow(0px 3px 6px rgba(0,0,0,0.15))");

        node.append("text")
          .text(d => d.label.length > (isModal ? 10 : 7) ? d.label.slice(0, isModal ? 9 : 6) + '..' : d.label)
          .attr("text-anchor", "middle").attr("dy", isModal ? 6 : 5)
          .attr("font-size", isModal ? "16px" : "13px").attr("font-weight", "bold")
          .attr("fill", d => {
            if (d.type === '긍정대처') return '#FFFFFF';
            return d.count > 1 ? "#FFFFFF" : "#92400E";
          });

        simulation.on("tick", () => {
          link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
          node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
      };

      useEffect(() => {
        if (viewType === 'graph' && svgRef.current) {
          renderD3(svgRef.current, false);
        }
      }, [chains, viewType]);

      useEffect(() => {
        if (isFullScreen && viewType === 'graph') {
          const timer = setTimeout(() => {
            if (modalSvgRef.current) {
              renderD3(modalSvgRef.current, true);
            }
          }, 80);
          return () => clearTimeout(timer);
        }
      }, [isFullScreen, chains, viewType]);

      return (
        <div className="flex flex-col h-full justify-between">
          <div>
            <div className="bg-amber-100/80 p-5 rounded-3xl border border-amber-200 mb-4 flex items-center justify-between">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-3xl">💡</span>
                  <h3 className="text-xl font-bold text-amber-950">내 마음 행동 지도</h3>
                </div>
                <p className="text-sm sm:text-base text-amber-900">
                  총 <strong className="text-amber-800 font-extrabold">{chains.length}번</strong>의 스트레스 & 회복 순간을 분석한 그림입니다.
                </p>
              </div>

              <div className="flex bg-white p-1 rounded-2xl border border-amber-300">
                <button
                  onClick={() => setViewType('graph')}
                  className={`px-3 py-1.5 text-xs font-bold rounded-xl ${
                    viewType === 'graph' ? 'bg-amber-500 text-white' : 'text-slate-600'
                  }`}
                >
                  🕸️ 그물망
                </button>
                <button
                  onClick={() => setViewType('timeline')}
                  className={`px-3 py-1.5 text-xs font-bold rounded-xl ${
                    viewType === 'timeline' ? 'bg-amber-500 text-white' : 'text-slate-600'
                  }`}
                >
                  🛤️ 순서대로
                </button>
              </div>
            </div>

            {/* 범례 안내바 */}
            <div className="flex items-center justify-center gap-4 bg-amber-50/80 py-2 px-3 rounded-2xl border border-amber-200/80 mb-3 text-xs font-bold">
              <span className="flex items-center gap-1.5 text-amber-800">
                <span className="w-3.5 h-3.5 rounded-full bg-amber-500 border border-amber-600 inline-block"></span>
                반복된 단골 행동
              </span>
              <span className="flex items-center gap-1.5 text-slate-600">
                <span className="w-3.5 h-3.5 rounded-full bg-amber-100 border border-amber-300 inline-block"></span>
                일상 반응
              </span>
              <span className="flex items-center gap-1.5 text-emerald-700">
                <span className="w-3.5 h-3.5 rounded-full bg-emerald-500 border border-emerald-600 inline-block"></span>
                🌱 긍정적 대처 (회복로)
              </span>
            </div>

            {hubInfo.label && (
              <div className="bg-white p-4 sm:p-5 rounded-3xl border-2 border-amber-400 shadow-sm mb-4 flex items-center justify-between">
                <div>
                  <span className="text-xs font-extrabold text-amber-800 uppercase tracking-wide block mb-1">
                    ⭐ 가장 자주 반복된 단골 행동/마음 (병목 노드)
                  </span>
                  <div className="text-xl sm:text-2xl font-extrabold text-slate-900">
                    "{hubInfo.label}"
                  </div>
                </div>
                <button
                  onClick={onGoReport}
                  className="px-4 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow-md touch-btn flex items-center gap-1.5"
                >
                  <span>💌</span> 마음 분석 편지 보기
                </button>
              </div>
            )}

            {viewType === 'graph' ? (
              <div className="relative bg-amber-50/50 rounded-3xl border-2 border-amber-200 overflow-hidden shadow-inner p-2">
                <div className="flex justify-between items-center px-2 py-1 mb-1">
                  <span className="text-xs text-amber-800 font-bold">동그라미를 콕 누르면 자세히 보입니다 👆</span>
                  <button
                    onClick={() => setIsFullScreen(true)}
                    className="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs shadow flex items-center gap-1 touch-btn"
                  >
                    <span>🔍</span> 화면 가득 크게보기
                  </button>
                </div>
                <svg ref={svgRef} className="w-full h-[350px]"></svg>
                {selectedNode && (
                  <div className="mt-2 p-3 bg-white rounded-2xl border-2 border-amber-500 shadow-md flex items-center justify-between">
                    <div>
                      <span className="text-xs font-bold text-amber-700 block">선택하신 내용 ({selectedNode.type})</span>
                      <span className="text-lg font-extrabold text-slate-900">{selectedNode.label} ({selectedNode.count}회 등장)</span>
                    </div>
                    <button onClick={() => setSelectedNode(null)} className="text-xs text-slate-400 hover:text-slate-600 p-1">닫기 ✕</button>
                  </div>
                )}
              </div>
            ) : (
              <div className="bg-amber-50/40 rounded-3xl border-2 border-amber-200 p-4 max-h-[440px] overflow-y-auto space-y-4">
                <div className="text-xs text-slate-500 font-bold mb-2">
                  최근 기록 일시: <strong className="text-amber-900 font-extrabold">{chains[0]?.date}</strong>
                </div>
                {chains[0]?.sequence.map((item, idx) => (
                  <div key={idx} className="flex items-center gap-3">
                    <div className={`w-9 h-9 rounded-full text-white font-extrabold text-sm flex items-center justify-center shrink-0 shadow ${
                      item.type === '긍정대처' ? 'bg-emerald-600' : 'bg-amber-500'
                    }`}>
                      {idx + 1}
                    </div>
                    <div className={`flex-1 bg-white p-3.5 rounded-2xl border shadow-sm flex items-center justify-between ${
                      item.type === '긍정대처' ? 'border-emerald-300 bg-emerald-50/30' : 'border-amber-200'
                    }`}>
                      <div>
                        <span className={`text-xs font-bold px-2 py-0.5 rounded-md mr-2 ${
                          item.type === '긍정대처' ? 'text-emerald-800 bg-emerald-100' : 'text-amber-700 bg-amber-50'
                        }`}>{item.type}</span>
                        <span className="text-base font-extrabold text-slate-900">{item.label}</span>
                      </div>
                      {idx < chains[0].sequence.length - 1 && <span className="text-amber-400 font-bold text-lg">➔</span>}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="flex gap-2.5 mt-5">
            <button
              onClick={onGoWizard}
              className="flex-1 py-4 bg-slate-100 hover:bg-slate-200 text-slate-800 font-extrabold text-lg rounded-2xl border border-slate-300 touch-btn"
            >
              ➕ 기록 추가
            </button>
            <button
              onClick={onGoReport}
              className="flex-[2] py-4 bg-amber-600 hover:bg-amber-700 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-amber-600/30 touch-btn flex items-center justify-center gap-2"
            >
              <span>💌</span> 마음 분석 편지 보기
            </button>
          </div>

          {/* 풀스크린 모달 */}
          {isFullScreen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-5xl h-[90vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden border-4 border-amber-400 animate-fadeIn">
                <div className="bg-amber-100 p-5 flex items-center justify-between border-b border-amber-200">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">🔍</span>
                    <div>
                      <h2 className="text-xl sm:text-2xl font-extrabold text-amber-950">시원하게 크게 보는 마음 행동 지도</h2>
                      <p className="text-xs sm:text-sm text-amber-800">초록색 동그라미는 나를 살리는 '긍정적 대처' 탈출로입니다.</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsFullScreen(false)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-2xl text-base shadow touch-btn"
                  >
                    닫기 ✕
                  </button>
                </div>
                <div className="flex-1 relative bg-amber-50/40 p-4 flex flex-col">
                  <svg ref={modalSvgRef} className="w-full h-full flex-1 rounded-2xl bg-white/60 border border-amber-200"></svg>
                  {selectedNode && (
                    <div className="mt-3 p-3.5 bg-white rounded-2xl border-2 border-amber-500 shadow-md flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-amber-700 block">선택 항목: [{selectedNode.type}]</span>
                        <span className="text-lg font-extrabold text-slate-900">{selectedNode.label} (누적 {selectedNode.count}회)</span>
                      </div>
                      <button onClick={() => setSelectedNode(null)} className="text-xs text-slate-400 hover:text-slate-600 p-1">선택 해제 ✕</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 내담자 전용 마음 분석 편지 뷰 (Client Only)
    // ==========================================
    function ClientAIReportView({ chains, nickname }) {
      const [apiKey, setApiKey] = useState(() => {
        try { return localStorage.getItem('mind_gemini_api_key') || ''; } catch (e) { return ''; }
      });
      const [isGenerating, setIsGenerating] = useState(false);
      const [aiLetter, setAiLetter] = useState('');
      const [generationMode, setGenerationMode] = useState('dynamic'); // 'gemini' | 'dynamic'
      const [copied, setCopied] = useState(false);

      const userName = nickname ? `${nickname} 님` : '선생님';

      // 상담자가 등록한 공유 Gemini API 키 자동 동기화
      useEffect(() => {
        if (window.MindDB && window.MindDB.AI) {
          window.MindDB.AI.getApiKey().then(sharedKey => {
            if (sharedKey && sharedKey !== apiKey) {
              setApiKey(sharedKey);
            }
          });
        }
      }, []);

      // 1. 내담자 기록 분석 통계 및 핵심 궤적 추출
      const metrics = React.useMemo(() => {
        if (!chains || chains.length === 0) return null;

        const countsByType = {
          '컨디션': {}, '계기': {}, '생각': {}, '감정': {},
          '몸느낌': {}, '행동': {}, '결과': {}, '긍정대처': {}
        };
        const inDeg = {}, outDeg = {};

        chains.forEach(c => {
          if (!Array.isArray(c.sequence)) return;
          c.sequence.forEach((s, idx) => {
            const label = s.label;
            if (countsByType[s.type]) {
              countsByType[s.type][label] = (countsByType[s.type][label] || 0) + 1;
            }
            if (idx > 0) inDeg[label] = (inDeg[label] || 0) + 1;
            if (idx < c.sequence.length - 1) outDeg[label] = (outDeg[label] || 0) + 1;
          });
        });

        const getTop = (obj, fallback) => {
          const sorted = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
          return sorted[0] ? sorted[0][0] : fallback;
        };

        const topBottleneck = getTop(countsByType['행동'], '혼자 웅크려 있기');
        const ignitionNode = Object.entries(outDeg).sort((a, b) => b[1] - a[1])[0]?.[0] || getTop(countsByType['계기'], '주변과의 마찰이나 부담감');
        const topCondition = getTop(countsByType['컨디션'], '피로와 수면 부족');
        const topTrigger = getTop(countsByType['계기'], '예상치 못한 마음의 부담');
        const topThought = getTop(countsByType['생각'], '부정적 자동적 생각');
        const topEmotion = getTop(countsByType['감정'], '불안과 답답함');
        const topBody = getTop(countsByType['몸느낌'], '가슴 두근거림 및 긴장');
        const topOutcome = getTop(countsByType['결과'], '자책감과 피로 누적');
        const topPositiveCoping = getTop(countsByType['긍정대처'], '따뜻한 차 마시기 및 심호흡');

        const latest = chains[0];
        const oldest = chains[chains.length - 1];
        const hasProgress = chains.length > 1;

        return {
          totalChains: chains.length,
          topBottleneck,
          ignitionNode,
          topCondition,
          topTrigger,
          topThought,
          topEmotion,
          topBody,
          topOutcome,
          topPositiveCoping,
          latestDate: latest?.date || '최근',
          latestSession: latest,
          oldestSession: oldest,
          hasProgress
        };
      }, [chains]);

      // 2. [지능형 동적 서사 엔진] - API 키 미입력 또는 오프라인 시 풍부하고 감동적인 맞춤 편지 작성
      const buildDynamicLetter = () => {
        if (!metrics) return "";

        const { totalChains, topCondition, topTrigger, topThought, topEmotion, topBody, topBottleneck, topOutcome, topPositiveCoping } = metrics;

        // 정서 및 신체 감각 기반의 감성적 공감 문맥
        let emotionContext = "";
        if (topEmotion.includes('불안') || topEmotion.includes('두려움') || topEmotion.includes('철렁')) {
          emotionContext = `가슴이 덜컥 내려앉고 세상이 흔들리는 듯한 불안이 엄습할 때, 몸은 '${topBody}' 신호로 그 다급함을 외치고 있었습니다.`;
        } else if (topEmotion.includes('우울') || topEmotion.includes('막막') || topEmotion.includes('공허') || topEmotion.includes('눈물')) {
          emotionContext = `끝이 보이지 않는 막막함과 쓸쓸한 마음에 가슴이 아려올 때, 온몸에 힘이 빠지고 '${topBody}' 무거운 감각이 온몸을 짓눌렀을 것입니다.`;
        } else if (topEmotion.includes('화') || topEmotion.includes('답답')) {
          emotionContext = `속에서 끓어오르는 답답함과 억울함으로 머리가 지끈거리고, 온몸이 '${topBody}' 굳어가는 고통을 홀로 삼키셔야 했습니다.`;
        } else {
          emotionContext = `마음 한구석의 복잡한 감정과 함께 몸에서 전해오는 '${topBody}' 느낌을 마주하며 적잖이 혼란스러우셨을 것입니다.`;
        }

        // 행동과 부적 강화의 자비로운 심리학적 해석
        let actionInterpretation = "";
        if (topBottleneck.includes('누워') || topBottleneck.includes('잠') || topBottleneck.includes('이불')) {
          actionInterpretation = `그 순간 '${topBottleneck}' 행동을 선택하셨던 것은 결코 의지가 약해서가 아닙니다. 과열된 엔진을 식히듯, 너무 지친 마음이 더는 다치지 않기 위해 본능적으로 선택한 '임시 긴급 셧다운'이었습니다. 비록 그 뒤에 '${topOutcome}'이(가) 찾아와 마음을 더 무겁게 했지만, 그때의 ${userName}은 그저 살기 위해 최선을 다해 버티고 계셨던 것입니다.`;
        } else if (topBottleneck.includes('피하') || topBottleneck.includes('연락') || topBottleneck.includes('숨') || topBottleneck.includes('방')) {
          actionInterpretation = `세상의 소음과 시선으로부터 도망쳐 '${topBottleneck}'을(를) 택하셨던 것은, 상처받은 내 여린 마음을 지키기 위한 '마음의 요새'가 절실했기 때문입니다. 비록 홀로 남겨진 자리에서 '${topOutcome}'이라는 씁쓸한 외로움이 맴돌았을지라도, 그 순간만큼은 나를 보호하려는 정직한 몸부림이었습니다.`;
        } else if (topBottleneck.includes('폭식') || topBottleneck.includes('음식') || topBottleneck.includes('먹') || topBottleneck.includes('단')) {
          actionInterpretation = `가슴의 공허함과 고통을 달래려 '${topBottleneck}'(으)로 향하셨던 발걸음은, 마음의 허기를 달래기 위한 가장 즉각적이고 다급한 자기 돌봄의 시도였습니다. 비록 뒤이어 찾아온 '${topOutcome}'으로 자책감이 드셨겠지만, 그만큼 ${userName}의 마음이 따뜻한 위로와 채움을 간절히 원하고 있었다는 증거입니다.`;
        } else {
          actionInterpretation = `마음의 소용돌이 속에서 '${topBottleneck}'(으)로 향했던 것은, 밀려오는 고통을 잠시나마 덜어내기 위한 마음의 정직한 대처였습니다. 비록 그 결과가 '${topOutcome}'(으)로 이어져 아쉬움이 남았을지라도, 그 고된 순간을 무사히 건너오신 것만으로도 참 애쓰셨습니다.`;
        }

        // 다회차 회기 비교 (진화와 성장의 발견)
        let trajectorySection = "";
        if (metrics.hasProgress) {
          trajectorySection = `\n> 🌿 **${userName}의 발걸음에서 발견한 작은 희망의 빛**\n> 지난 ${totalChains}번의 기록들을 톺아보면, 거센 스트레스 폭풍 속에서도 점차 나를 잃지 않으려는 노력이 선명해지고 있습니다. 특히 최근 기록에서 스스로 선택하신 긍정 대처인 **"${topPositiveCoping}"**은, 어두운 방 안에 조용히 촛불 하나를 켜는 것과 같은 눈부신 용기입니다.\n`;
        }

        return `친애하는 ${userName}께,

${userName}께서 정성껏 남겨주신 ${totalChains}번의 마음 기록을 가만히 읽어내려가며, 그동안 홀로 견뎌내셨을 고단함과 애틋한 마음이 고스란히 전해져 왔습니다.

어떤 날은 '${topCondition}' 상태로 하루를 시작하며 몸과 마음의 에너지가 이미 바닥나 있었고, 그 상태에서 불쑥 마주친 '${topTrigger}'(은)는 감당하기 벅찬 파도처럼 밀려왔을 것입니다.

머릿속에서 "${topThought}"라는 날카로운 생각이 번쩍일 때, ${emotionContext}

${actionInterpretation}
${trajectorySection}
이제는 자책의 무거운 외투를 벗어두고, 스스로에게 가장 친절한 친구가 되어주실 시간입니다. ${userName}께서 마음으로 직접 약속해 주신 **"${topPositiveCoping}"**을 중심으로, 오늘 하루 부담 없이 실천해볼 세 가지 작은 쉼표를 제안해 드립니다.

---

### 🌱 ${userName}을 위한 '오늘의 3단계 마음 돌봄 가이드'

1. **[1단계: 알아차림] 몸의 신호에 다정하게 이름 붙이기**
   - 몸에서 **"${topBody}"** 느낌이 쿵 하고 감지될 때, 놀라지 마시고 *"아, 지금 내 몸과 마음이 긴장하고 있구나. 잠깐 쉬어가라는 신호구나"*라고 가만히 읊조려 주세요.

2. **[2단계: 멈춤과 자기위로] 나를 안아주는 3초 쉼표**
   - 머릿속에 **"${topThought}"** 생각이 스칠 때 반박하거나 자책하지 말고, 가슴에 손을 얹은 채 *"그동안 참 많이 버텨왔어, 지금 이대로도 괜찮아"*라며 세 번의 깊은 숨을 내쉬어 보세요.

3. **[3단계: 내 손으로 선택한 회복] 3분 미세 행동 실천**
   - 익숙한 회피로 돌아가기 전, ${userName}이 직접 정하신 **"${topPositiveCoping}"**을 딱 3분만 먼저 실행해 보세요. 이 작은 3분이 악순환의 사슬을 끊고 새로운 회복의 길을 열어줄 것입니다.

${userName}의 마음 정원에 다시 푸른 싹이 돋아나길 온 마음으로 응원합니다.

— ${userName}의 마음 곁에서, **마음 돋보기** 드림 🌻`;
      };

      // 3. Gemini API 실시간 LLM 편지 생성 (키가 있거나 연결 가능 시)
      const generateGeminiLetter = async (currentKey = apiKey) => {
        const cleanKey = (currentKey || '').trim();
        if (!cleanKey) {
          // 상담자가 등록한 키가 없는 경우 내장 지능형 서사 엔진으로 조용히 생성
          setAiLetter(buildDynamicLetter());
          setGenerationMode('dynamic');
          return;
        }

        setIsGenerating(true);
        try {
          const sessionDetails = chains.map((c, i) => 
            `[${i + 1}번째 기록 - ${c.date}]\n` +
            (c.sequence || []).map(s => `  • ${s.type}: ${s.label}`).join('\n')
          ).join('\n\n');

          const prompt = `당신은 행동활성화(Behavioral Activation, BA)와 수용전념치료(ACT)에 정통한, 세상에서 가장 따뜻하고 지혜로운 임상심리상담사입니다.
내담자 [${userName}]님의 최근 마음 기록(${chains.length}회)을 깊이 공감하며 꼼꼼히 읽고, 내담자에게 전하는 감동적이고 유려한 [따뜻한 마음 분석 편지]를 작성해 주세요.

[내담자 실제 기록 내역]
${sessionDetails}

[편지 작성 원칙]
1. 다정한 편지체(~해요, ~하셨군요, ~드립니다)로, 상담사가 찻잔을 앞에 두고 정성껏 손글씨 편지를 써서 건네는 듯한 온기 있는 어조로 작성하세요.
2. 내담자가 선택하거나 직접 적은 구체적인 어휘(생각, 감정, 신체 반응, 긍정 대처 등)를 본문에 자연스럽게 녹여내어 "내 마음을 정말 꿰뚫어 보고 있구나"라는 깊은 이해와 유효화(Validation)를 느끼게 하세요.
3. 내담자의 회피 행동이나 무기력 패턴을 절대 비난하지 말고, 고통을 줄이기 위해 애썼던 '부적 강화(Negative Reinforcement)'의 심리 메커니즘을 따뜻하게 설명해 주세요.
4. 내담자가 직접 적거나 고른 [긍정 대처]를 중심으로, 오늘 일상에서 3분 만에 실천할 수 있는 [작고 구체적인 3단계 마이크로 실천 약속]을 제안해 주세요.
5. 마크다운 형식을 활용해 읽기 편하게 구성하세요. 분량은 1,000자 내외로 풍부하게 작성하세요.`;

          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${cleanKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.7, maxOutputTokens: 2500 }
            })
          });

          const data = await res.json();
          if (data.error) throw new Error(data.error.message || "API 호출 실패");
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) {
            setAiLetter(text);
            setGenerationMode('gemini');
          } else {
            throw new Error("응답이 비어있습니다.");
          }
        } catch (err) {
          console.warn("[마음 편지] Gemini API 호출 안내: 내장 지능형 서사 엔진으로 자동 전환합니다:", err);
          // 내담자에게는 에러 팝업을 띄우지 않고 자연스럽게 고품격 동적 편지글 제공
          setAiLetter(buildDynamicLetter());
          setGenerationMode('dynamic');
        } finally {
          setIsGenerating(false);
        }
      };

      // 초기 로드 시 자동 생성
      useEffect(() => {
        if (!chains || chains.length === 0) return;
        if (apiKey.trim()) {
          generateGeminiLetter(apiKey);
        } else {
          setAiLetter(buildDynamicLetter());
          setGenerationMode('dynamic');
        }
      }, [chains, apiKey]);

      const handleCopy = () => {
        if (!aiLetter) return;
        navigator.clipboard.writeText(aiLetter).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2500);
        });
      };

      // 마크다운 줄바꿈 및 스타일 렌더링 헬퍼
      const renderLetterHtml = (text) => {
        if (!text) return null;

        const lines = text.split('\n');
        return lines.map((line, idx) => {
          const trimmed = line.trim();

          if (trimmed.startsWith('###')) {
            return (
              <h4 key={idx} className="text-xl font-extrabold text-amber-950 mt-6 mb-3 flex items-center gap-2">
                {trimmed.replace(/^###\s*/, '')}
              </h4>
            );
          }
          if (trimmed.startsWith('##')) {
            return (
              <h3 key={idx} className="text-2xl font-black text-amber-950 mt-7 mb-3 border-b border-amber-200 pb-2">
                {trimmed.replace(/^##\s*/, '')}
              </h3>
            );
          }
          if (trimmed.startsWith('>')) {
            return (
              <div key={idx} className="my-4 p-4 bg-emerald-50/80 border-l-4 border-emerald-500 rounded-r-2xl text-emerald-950 font-medium text-base sm:text-lg">
                <span dangerouslySetInnerHTML={{ __html: trimmed.replace(/^>\s*/, '').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') }} />
              </div>
            );
          }
          if (trimmed.startsWith('---')) {
            return <hr key={idx} className="my-5 border-amber-200" />;
          }
          if (trimmed.match(/^\d+\.\s/)) {
            const content = trimmed.replace(/^\d+\.\s*/, '');
            return (
              <div key={idx} className="my-2.5 pl-4 border-l-2 border-amber-300">
                <span className="font-extrabold text-amber-900 mr-2">{trimmed.match(/^\d+\./)[0]}</span>
                <span dangerouslySetInnerHTML={{ __html: content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>') }} />
              </div>
            );
          }
          if (trimmed.startsWith('- ') || trimmed.startsWith('• ')) {
            const content = trimmed.replace(/^[-•]\s*/, '');
            return (
              <div key={idx} className="my-1.5 pl-4 flex items-start gap-2">
                <span className="text-amber-600 font-bold shrink-0">•</span>
                <span dangerouslySetInnerHTML={{ __html: content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>') }} />
              </div>
            );
          }
          if (!trimmed) {
            return <div key={idx} className="h-3" />;
          }

          return (
            <p key={idx} className="leading-relaxed my-2" dangerouslySetInnerHTML={{
              __html: trimmed.replace(/\*\*(.*?)\*\*/g, '<strong class="text-amber-950 font-extrabold">$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>')
            }} />
          );
        });
      };

      if (!metrics) {
        return (
          <div className="p-8 text-center text-slate-500">
            기록된 마음 데이터가 없습니다. 먼저 ✏️ 기록하기 탭에서 마음을 기록해 보세요.
          </div>
        );
      }

      return (
        <div className="space-y-5 animate-fadeIn pb-12">
          {/* 상단 툴바 카드 (내담자 전용 깔끔한 디자인) */}
          <div className="bg-gradient-to-r from-amber-100/90 to-amber-200/70 border border-amber-300 rounded-3xl p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-sm">
            <div className="flex items-center gap-3">
              <span className="text-4xl">💌</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-black text-amber-900 uppercase tracking-wider">
                    {generationMode === 'gemini' ? '✨ AI 맞춤 마음 편지' : '🌱 나만의 맞춤 마음 편지'}
                  </span>
                  <span className="text-[11px] px-2 py-0.5 rounded-full bg-white/90 text-amber-800 font-bold border border-amber-300">
                    총 {metrics.totalChains}회 분석
                  </span>
                </div>
                <h3 className="text-xl sm:text-2xl font-black text-amber-950 tracking-tight">
                  {userName}을 위한 따뜻한 마음 편지
                </h3>
              </div>
            </div>

            <div className="flex items-center gap-2 self-end sm:self-auto">
              <button
                onClick={() => apiKey ? generateGeminiLetter() : setAiLetter(buildDynamicLetter())}
                disabled={isGenerating}
                className="px-3.5 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow touch-btn flex items-center gap-1.5 disabled:opacity-50"
                title="편지 다시 쓰기"
              >
                <span>🔄</span>
                <span>{isGenerating ? '작성 중...' : '편지 다시 쓰기'}</span>
              </button>

              <button
                onClick={handleCopy}
                className="px-3.5 py-2 bg-white hover:bg-amber-50 text-amber-950 border border-amber-300 text-xs sm:text-sm font-bold rounded-xl shadow-sm touch-btn flex items-center gap-1.5"
                title="편지 본문 복사하기"
              >
                <span>{copied ? '✅' : '📋'}</span>
                <span>{copied ? '복사됨!' : '편지 복사'}</span>
              </button>
            </div>
          </div>

          {/* 본문 감성 편지지 카드 */}
          <div className="bg-[#FFFDF9] p-6 sm:p-8 rounded-3xl border-2 border-amber-200/80 shadow-md relative overflow-hidden">
            {/* 배경 워터마크 장식 */}
            <div className="absolute right-[-10px] top-[-10px] text-8xl opacity-10 pointer-events-none select-none">
              🌻
            </div>

            {isGenerating ? (
              <div className="py-20 text-center space-y-4">
                <div className="text-5xl animate-bounce">✍️</div>
                <h4 className="text-xl font-black text-amber-950">
                  {userName}을 위한 따뜻한 편지를 정성껏 적고 있습니다...
                </h4>
                <p className="text-sm text-slate-500 font-medium">
                  {userName}이 남겨주신 소중한 기록들을 가만히 되짚어보는 중입니다 😊
                </p>
              </div>
            ) : (
              <div className="space-y-4 text-base sm:text-lg text-slate-800 leading-relaxed font-sans">
                {renderLetterHtml(aiLetter)}
              </div>
            )}
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(rootElement).render(<App />);
    } else {
      ReactDOM.render(<App />, rootElement);
    }
  </script>
</body>
</html>
