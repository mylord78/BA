<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마음 돋보기 - 스트레스 행동 체인 & 마음 편지</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- D3.js v7 -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #FEFDF9;
      color: #1E293B;
      font-size: 18px;
    }
    .touch-btn {
      transition: all 0.15s ease-in-out;
    }
    .touch-btn:active {
      transform: scale(0.98);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-amber-50/40 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 8단계 설문 정보 (8단계: 긍정적 대처 포함)
    const STEP_INFO = [
      { step: 1, title: "몸과 마음의 컨디션", desc: "힘든 일이 생기기 전, 내 몸과 마음 상태는 어떠셨나요?", icon: "🛌" },
      { step: 2, title: "속상했던 계기", desc: "어떤 일 때문에 마음이 흔들리기 시작하셨나요?", icon: "⚡" },
      { step: 3, title: "그때 스친 생각", desc: "머릿속에 어떤 생각이 가장 먼저 맴돌았나요?", icon: "💭" },
      { step: 4, title: "차오른 감정", desc: "가슴속에 어떤 마음이 가장 크게 느껴지셨나요?", icon: "❤️" },
      { step: 5, title: "몸의 느낌 (신체 반응)", desc: "몸에서는 어떤 신호나 불편함이 느껴졌나요?", icon: "🫀" },
      { step: 6, title: "내가 했던 행동", desc: "그 순간을 피하거나 달래기 위해 어떤 행동을 하셨나요?", icon: "🏃" },
      { step: 7, title: "그 뒤에 남은 결과", desc: "그 행동을 하고 난 뒤, 마음에 어떤 결과가 남았나요?", icon: "⏳" },
      { step: 8, title: "나를 돌보는 긍정적 대처", desc: "이 악순환을 멈추고 나를 보살피기 위해 어떤 작은 행동을 해볼 수 있을까요?", icon: "🌱" }
    ];

    const PRESETS = {
      1: ["잠을 잘 못 잤어요 💤", "끼니를 걸렀어요 🍚", "온몸이 뻐근하고 피곤했어요 🔋", "약 복용을 깜빡했어요 💊", "날씨가 찌뿌둥했어요 🌧️", "혼자 있어 외로웠어요 👤"],
      2: ["가족과 말다툼 🗣️", "남의 무심한 한마디 💬", "병원/약속 가기 싫음 🏥", "돈이나 생활비 걱정 💸", "갑작스러운 큰 소리/소음 📢", "옛날 괴로운 기억 🌧️"],
      3: ["'다 내 탓이야...' 😔", "'아무것도 하기 싫어' 🛑", "'누가 날 욕하나 봐' 👂", "'난 이제 쓸모없어' 🍂", "'사람들이 날 피하나?' 👥", "'어차피 다 소용없어' 🚪"],
      4: ["가슴 철렁 불안함 😰", "바닥 모를 우울함 🌧️", "주체 안 되는 화/짜증 😡", "앞이 캄캄한 두려움 😨", "그냥 멍하고 텅 빈 마음 😶", "외롭고 서러운 마음 😢"],
      5: ["가슴이 쿵쾅쿵쾅 뛰어요 💓", "숨쉬기가 답답해요 😮‍💨", "온몸에 힘이 쭉 빠져요 🫠", "머리가 지끈지끈 아파요 🤕", "어깨와 목이 굳어요 🧱", "속이 더부룩해요 🤢"],
      6: ["하루 종일 누워있기 🛌", "전화/문자 다 피하기 🔕", "TV/유튜브 멍하니 보기 📺", "단 음식이나 밥 폭식 🍩", "집 밖으로 안 나가기 🚪", "담배나 술 찾기 🍺"],
      7: ["잠깐은 편안했어요 (단기 안도) 😌", "더 외롭고 답답해졌어요 😢", "하루를 날려 자책감이 들어요 😔", "가족에게 더 미안해졌어요 🙏", "몸이 더 무겁고 처져요 🔋"],
      8: [
        "따뜻한 물/차 한 잔 천천히 마시기 🍵",
        "창문 열고 3분간 바깥 공기 쐬기 🪟",
        "마음이 편안해지는 음악이나 라디오 듣기 🎵",
        "신뢰하는 지인/가족에게 짧은 안부 묻기 💬",
        "집 앞 골목이나 공원 5분간 천천히 걷기 🚶",
        "3번의 깊은 복식호흡과 기지개 켜기 🌬️",
        "'오늘도 애썼어' 스스로 따뜻하게 토닥이기 🫂",
        "따뜻한 물로 세수하거나 샤워하기 🚿"
      ]
    };

    // 초기 데이터 (며칠 전 ➔ 정확한 일시로 표시)
    const INITIAL_CHAINS = [
      {
        id: 1001,
        nickname: "해바라기",
        date: "2026.09.01 14:30",
        sequence: [
          { type: '컨디션', label: '잠을 잘 못 잤어요' },
          { type: '계기', label: '가족과 말다툼' },
          { type: '생각', label: '다 내 탓이야...' },
          { type: '감정', label: '가슴 철렁 불안함' },
          { type: '몸느낌', label: '숨쉬기가 답답해요' },
          { type: '행동', label: '하루 종일 누워있기' },
          { type: '결과', label: '더 외롭고 답답해졌어요' },
          { type: '긍정대처', label: '따뜻한 물/차 한 잔 천천히 마시기' }
        ]
      },
      {
        id: 1002,
        nickname: "해바라기",
        date: "2026.09.02 09:15",
        sequence: [
          { type: '컨디션', label: '온몸이 뻐근하고 피곤했어요' },
          { type: '계기', label: '남의 무심한 한마디' },
          { type: '생각', label: '아무것도 하기 싫어' },
          { type: '감정', label: '가슴 철렁 불안함' },
          { type: '몸느낌', label: '숨쉬기가 답답해요' },
          { type: '행동', label: '하루 종일 누워있기' },
          { type: '결과', label: '하루를 날려 자책감이 들어요' },
          { type: '긍정대처', label: '창문 열고 3분간 바깥 공기 쐬기' }
        ]
      }
    ];

    // ==========================================
    // IndexedDB 브라우저 영구 저장소
    // ==========================================
    const DB_NAME = 'MindLensDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'surveys';

    const MindDB = {
      open: () => {
        return new Promise((resolve) => {
          if (!window.indexedDB) {
            resolve(null);
            return;
          }
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              const store = db.createObjectStore(STORE_NAME, { keyPath: 'id' });
              store.createIndex('nickname', 'nickname', { unique: false });
              store.createIndex('createdAt', 'createdAt', { unique: false });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
      },

      getAll: async () => {
        const db = await MindDB.open();
        if (!db) {
          try {
            const backup = localStorage.getItem('mind_surveys_backup');
            return backup ? JSON.parse(backup) : null;
          } catch (e) { return null; }
        }
        return new Promise((resolve) => {
          try {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const req = store.getAll();
            req.onsuccess = () => {
              const res = req.result;
              if (res && res.length > 0) {
                resolve(res.sort((a, b) => b.id - a.id));
              } else {
                try {
                  const backup = localStorage.getItem('mind_surveys_backup');
                  resolve(backup ? JSON.parse(backup) : null);
                } catch (e) { resolve(null); }
              }
            };
            req.onerror = () => resolve(null);
          } catch (e) { resolve(null); }
        });
      },

      save: async (record) => {
        // localStorage 백업
        try {
          const existingStr = localStorage.getItem('mind_surveys_backup');
          const list = existingStr ? JSON.parse(existingStr) : [];
          const filtered = list.filter(item => item.id !== record.id);
          filtered.unshift(record);
          localStorage.setItem('mind_surveys_backup', JSON.stringify(filtered));
        } catch (e) {}

        // IndexedDB 저장
        const db = await MindDB.open();
        if (db) {
          try {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.put(record);
          } catch (e) {}
        }
      }
    };

    // ==========================================
    // 메인 App 컴포넌트 (내담자 전용)
    // ==========================================
    function App() {
      const [tab, setTab] = useState('wizard'); // 'wizard' | 'network' | 'aiReport'
      const [currentStep, setCurrentStep] = useState(1);
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [customInput, setCustomInput] = useState('');
      const [chains, setChains] = useState(INITIAL_CHAINS);

      // 닉네임 관리
      const [nickname, setNickname] = useState(() => localStorage.getItem('mind_user_nickname') || '');
      const [showNicknameModal, setShowNicknameModal] = useState(() => !localStorage.getItem('mind_user_nickname'));
      const [inputNick, setInputNick] = useState('');

      useEffect(() => {
        MindDB.getAll().then((saved) => {
          if (saved && saved.length > 0) {
            setChains(saved);
          } else {
            INITIAL_CHAINS.forEach(item => MindDB.save(item));
          }
        });
      }, []);

      const handleSaveNickname = (name) => {
        const trimmed = (name || inputNick).trim();
        if (!trimmed) {
          alert("편하게 부르실 수 있는 닉네임을 적어주세요 😊");
          return;
        }
        setNickname(trimmed);
        try {
          localStorage.setItem('mind_user_nickname', trimmed);
        } catch (e) {}
        setShowNicknameModal(false);
      };

      const handleSelectOption = (optionText) => {
        setSelectedAnswers(prev => ({ ...prev, [currentStep]: optionText }));
      };

      const handleNext = () => {
        if (!selectedAnswers[currentStep] && !customInput.trim()) {
          alert("마음에 드는 항목을 하나 콕 눌러주시거나, 아래에 적어주세요 😊");
          return;
        }
        if (customInput.trim()) {
          setSelectedAnswers(prev => ({ ...prev, [currentStep]: customInput.trim() }));
          setCustomInput('');
        }

        if (currentStep < 8) {
          setCurrentStep(prev => prev + 1);
        } else {
          saveChain();
        }
      };

      // 8단계 설문 저장 핸들러 (정확한 일시 포맷 기록)
      const saveChain = async () => {
        const types = ['컨디션', '계기', '생각', '감정', '몸느낌', '행동', '결과', '긍정대처'];
        const newSeq = types.map((typeName, idx) => ({
          type: typeName,
          label: (selectedAnswers[idx + 1] || customInput).replace(/[\u{1F300}-\u{1F9FF}]/gu, '').trim()
        }));

        const now = new Date();
        const pad = (n) => n.toString().padStart(2, '0');
        const dateStr = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

        const newEntry = {
          id: Date.now(),
          nickname: nickname || "익명",
          date: dateStr,
          createdAt: now.toISOString(),
          sequence: newSeq
        };

        await MindDB.save(newEntry);
        setChains([newEntry, ...chains]);

        alert(`참 잘하셨습니다, ${nickname || '선생'}님! 🌻\n소중한 마음 기록과 긍정 대처가 저장되었습니다.\n내 마음 행동 지도로 안내해 드립니다.`);
        setCurrentStep(1);
        setSelectedAnswers({});
        setCustomInput('');
        setTab('network');
      };

      return (
        <div className="max-w-2xl mx-auto min-h-screen flex flex-col bg-white shadow-2xl border-x border-amber-100 relative">
          {/* 상단 헤더 */}
          <header className="bg-amber-100/90 px-6 py-5 border-b border-amber-200">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <span className="text-4xl">🌻</span>
                <div>
                  <h1 className="text-2xl sm:text-3xl font-extrabold text-amber-950 tracking-tight">마음 돋보기</h1>
                  <p className="text-sm sm:text-base font-semibold text-amber-800">스트레스 속 내 행동 & 긍정 대처 살피기</p>
                </div>
              </div>

              {/* 닉네임 & 관리자 링크 */}
              <div className="flex flex-col items-end gap-1.5">
                <button
                  onClick={() => { setInputNick(nickname); setShowNicknameModal(true); }}
                  className="px-3 py-1 bg-amber-200 hover:bg-amber-300 text-amber-950 rounded-full text-xs font-extrabold flex items-center gap-1 shadow-sm touch-btn"
                  title="닉네임 변경하기"
                >
                  <span>👤</span>
                  <span>{nickname ? `${nickname}님` : '닉네임 등록'}</span>
                  <span className="text-[10px] text-amber-700">✏️</span>
                </button>

                <a
                  href="admin.html"
                  className="px-2.5 py-1 bg-slate-800 hover:bg-slate-900 text-slate-100 rounded-full text-[11px] font-bold flex items-center gap-1 shadow-sm touch-btn"
                  title="연구자/상담사용 관리자 콘솔로 이동"
                >
                  <span>🎓</span>
                  <span>관리자 콘솔 ➔</span>
                </a>
              </div>
            </div>

            {/* 3가지 탭 메뉴 (내담자 전용) */}
            <nav className="flex gap-2 mt-5">
              <button
                onClick={() => setTab('wizard')}
                className={`flex-1 py-3 text-base sm:text-lg font-bold rounded-2xl touch-btn shadow-sm flex items-center justify-center gap-1.5 ${
                  tab === 'wizard' ? 'bg-amber-600 text-white shadow-md' : 'bg-white/80 text-amber-900 hover:bg-white'
                }`}
              >
                <span>✏️</span> 기록하기
              </button>
              <button
                onClick={() => setTab('network')}
                className={`flex-1 py-3 text-base sm:text-lg font-bold rounded-2xl touch-btn shadow-sm flex items-center justify-center gap-1.5 ${
                  tab === 'network' ? 'bg-amber-600 text-white shadow-md' : 'bg-white/80 text-amber-900 hover:bg-white'
                }`}
              >
                <span>🕸️</span> 행동 지도
              </button>
              <button
                onClick={() => setTab('aiReport')}
                className={`flex-1 py-3 text-base sm:text-lg font-bold rounded-2xl touch-btn shadow-sm flex items-center justify-center gap-1.5 ${
                  tab === 'aiReport' ? 'bg-amber-600 text-white shadow-md' : 'bg-white/80 text-amber-900 hover:bg-white'
                }`}
              >
                <span>💌</span> 마음 분석 편지
              </button>
            </nav>
          </header>

          {/* 메인 뷰 */}
          <main className="flex-1 p-6 flex flex-col">
            {tab === 'wizard' && (
              <div className="flex-1 flex flex-col justify-between">
                <div>
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-sm font-extrabold text-amber-800 bg-amber-100 px-3.5 py-1.5 rounded-full">
                      {currentStep}단계 / 총 8단계 {currentStep === 8 && "🌟 (회복과 긍정 대처)"}
                    </span>
                    <span className="text-sm text-slate-500 font-medium">천천히 하나만 골라보세요</span>
                  </div>

                  <div className="w-full bg-amber-100 h-3.5 rounded-full overflow-hidden mb-6">
                    <div
                      className={`h-full rounded-full transition-all duration-300 ${currentStep === 8 ? 'bg-emerald-500' : 'bg-amber-500'}`}
                      style={{ width: `${(currentStep / 8) * 100}%` }}
                    ></div>
                  </div>

                  <div className={`p-5 rounded-3xl border mb-5 ${
                    currentStep === 8 
                      ? 'bg-emerald-50/80 border-emerald-300' 
                      : 'bg-amber-50/70 border-amber-200'
                  }`}>
                    <div className="flex items-center gap-3 mb-2">
                      <span className="text-4xl">{STEP_INFO[currentStep - 1].icon}</span>
                      <h2 className={`text-2xl font-extrabold ${currentStep === 8 ? 'text-emerald-950' : 'text-slate-900'}`}>
                        {STEP_INFO[currentStep - 1].title}
                      </h2>
                    </div>
                    <p className="text-lg font-medium text-slate-700 leading-relaxed">
                      {STEP_INFO[currentStep - 1].desc}
                    </p>
                  </div>

                  <div className="grid grid-cols-1 gap-3 mb-5">
                    {PRESETS[currentStep]?.map((opt, i) => {
                      const isSelected = selectedAnswers[currentStep] === opt;
                      return (
                        <button
                          key={i}
                          onClick={() => handleSelectOption(opt)}
                          className={`w-full min-h-[64px] py-4 px-5 rounded-2xl text-left font-bold text-lg sm:text-xl border-2 touch-btn flex items-center justify-between ${
                            isSelected
                              ? (currentStep === 8 
                                  ? 'bg-emerald-600 text-white border-emerald-700 shadow-md scale-[1.01]' 
                                  : 'bg-amber-500 text-white border-amber-600 shadow-md scale-[1.01]')
                              : 'bg-white text-slate-800 border-slate-200 hover:border-amber-300 hover:bg-amber-50/40'
                          }`}
                        >
                          <span>{opt}</span>
                          {isSelected && <span className="text-2xl">✔️</span>}
                        </button>
                      );
                    })}
                  </div>

                  <div className="mb-4">
                    <label className="block text-sm font-bold text-slate-600 mb-1.5">
                      ✍️ 찾으시는 내용이 없나요? 편하게 적으셔도 됩니다:
                    </label>
                    <input
                      type="text"
                      value={customInput}
                      onChange={(e) => setCustomInput(e.target.value)}
                      placeholder={currentStep === 8 ? "예: 좋아하는 화분에 물 주기, 반려견 쓰다듬기..." : "예: 이웃과 마주쳤을 때..."}
                      className="w-full text-base sm:text-lg border-2 border-slate-200 rounded-2xl p-4 focus:border-amber-500 focus:outline-none bg-white"
                    />
                  </div>
                </div>

                <div className="flex gap-3 pt-4 border-t border-slate-200 mt-6">
                  {currentStep > 1 && (
                    <button
                      onClick={() => setCurrentStep(prev => prev - 1)}
                      className="flex-1 py-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-lg rounded-2xl touch-btn"
                    >
                      ⬅️ 이전으로
                    </button>
                  )}
                  <button
                    onClick={handleNext}
                    className={`flex-[2] py-4 text-white font-extrabold text-xl rounded-2xl shadow-lg touch-btn ${
                      currentStep === 8 
                        ? 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-600/30' 
                        : 'bg-amber-600 hover:bg-amber-700 shadow-amber-600/30'
                    }`}
                  >
                    {currentStep === 8 ? "✨ 다 적었어요 (저장하기)" : "다음으로 ➡️"}
                  </button>
                </div>
              </div>
            )}

            {tab === 'network' && (
              <NetworkView chains={chains} onGoWizard={() => setTab('wizard')} onGoReport={() => setTab('aiReport')} />
            )}

            {tab === 'aiReport' && (
              <ClientAIReportView chains={chains} nickname={nickname} />
            )}
          </main>

          {/* 닉네임 입력 모달 */}
          {showNicknameModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
              <div className="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl border-4 border-amber-400 space-y-5">
                <div className="text-center space-y-2">
                  <span className="text-5xl inline-block">🌻</span>
                  <h3 className="text-2xl font-black text-amber-950">마음 돋보기에 오신 것을 환영합니다</h3>
                  <p className="text-sm font-medium text-slate-600 leading-relaxed">
                    선생님을 어떻게 불러드리면 좋을까요?<br/>
                    한번 저장해 두시면 다음 접속부터는 다시 묻지 않습니다 😊
                  </p>
                </div>

                <div>
                  <label className="block text-xs font-bold text-amber-900 mb-1">내 닉네임 (별명)</label>
                  <input
                    type="text"
                    value={inputNick}
                    onChange={(e) => setInputNick(e.target.value)}
                    placeholder="예: 행복한 해바라기, 맑은 하늘, 솔바람..."
                    onKeyDown={(e) => { if (e.key === 'Enter') handleSaveNickname(inputNick); }}
                    className="w-full text-lg border-2 border-amber-300 rounded-2xl p-3.5 focus:border-amber-600 focus:outline-none"
                    autoFocus
                  />
                </div>

                <div>
                  <span className="text-xs font-bold text-slate-400 block mb-1.5">추천 별명 (눌러서 선택):</span>
                  <div className="flex flex-wrap gap-1.5">
                    {["행복한 해바라기 🌻", "맑은 하늘 ☀️", "푸른 소나무 🌲", "은빛나래 🕊️", "따뜻한 차 한 잔 🍵"].map((tag, idx) => (
                      <button
                        key={idx}
                        onClick={() => { setInputNick(tag.split(' ')[0]); handleSaveNickname(tag.split(' ')[0]); }}
                        className="text-xs px-2.5 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-900 rounded-xl border border-amber-200 font-bold touch-btn"
                      >
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  {nickname && (
                    <button
                      onClick={() => setShowNicknameModal(false)}
                      className="flex-1 py-3.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-2xl touch-btn text-base"
                    >
                      취소
                    </button>
                  )}
                  <button
                    onClick={() => handleSaveNickname(inputNick)}
                    className="flex-[2] py-3.5 bg-amber-600 hover:bg-amber-700 text-white font-extrabold rounded-2xl shadow-md text-lg touch-btn"
                  >
                    마음 돋보기 시작하기 🚀
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 네트워크 행동 지도 뷰 (내담자용)
    // ==========================================
    function NetworkView({ chains, onGoWizard, onGoReport }) {
      const svgRef = useRef(null);
      const modalSvgRef = useRef(null);
      const zoomBehaviorRef = useRef(null);

      const [hubInfo, setHubInfo] = useState({ label: '', count: 0 });
      const [isFullScreen, setIsFullScreen] = useState(false);
      const [viewType, setViewType] = useState('graph');
      const [selectedNode, setSelectedNode] = useState(null);

      const prepareGraphData = () => {
        const nodeMap = new Map();
        const edgeMap = new Map();

        chains.forEach(c => {
          const seq = c.sequence;
          for (let i = 0; i < seq.length; i++) {
            const cur = seq[i];
            const id = cur.label;
            if (!nodeMap.has(id)) {
              nodeMap.set(id, { id, label: cur.label, type: cur.type, count: 1 });
            } else {
              nodeMap.get(id).count += 1;
            }

            if (i < seq.length - 1) {
              const next = seq[i + 1];
              const edgeKey = `${id}->${next.label}`;
              if (!edgeMap.has(edgeKey)) {
                edgeMap.set(edgeKey, { source: id, target: next.label, weight: 1 });
              } else {
                edgeMap.get(edgeKey).weight += 1;
              }
            }
          }
        });

        return { nodes: Array.from(nodeMap.values()), edges: Array.from(edgeMap.values()) };
      };

      const renderD3 = (targetSvg, isModal = false) => {
        if (!targetSvg) return;
        const { nodes, edges } = prepareGraphData();
        const sorted = [...nodes].filter(n => n.type !== '긍정대처').sort((a, b) => b.count - a.count);
        if (sorted.length > 0) setHubInfo({ label: sorted[0].label, count: sorted[0].count });

        const rect = targetSvg.getBoundingClientRect();
        const width = (rect && rect.width > 50) ? rect.width : (targetSvg.clientWidth || (isModal ? 800 : 500));
        const height = (rect && rect.height > 50) ? rect.height : (isModal ? 540 : 360);

        d3.select(targetSvg).selectAll("*").remove();
        const svg = d3.select(targetSvg).attr("viewBox", [0, 0, width, height]);
        const g = svg.append("g");

        const zoom = d3.zoom().scaleExtent([0.4, 3.5]).on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);
        zoomBehaviorRef.current = { zoom, svg };

        svg.append("defs").append("marker")
          .attr("id", isModal ? "arrow-m" : "arrow")
          .attr("viewBox", "0 -5 10 10").attr("refX", isModal ? 36 : 30).attr("refY", 0)
          .attr("markerWidth", isModal ? 9 : 8).attr("markerHeight", isModal ? 9 : 8).attr("orient", "auto")
          .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "#F59E0B");

        svg.append("defs").append("marker")
          .attr("id", isModal ? "arrow-green-m" : "arrow-green")
          .attr("viewBox", "0 -5 10 10").attr("refX", isModal ? 36 : 30).attr("refY", 0)
          .attr("markerWidth", isModal ? 9 : 8).attr("markerHeight", isModal ? 9 : 8).attr("orient", "auto")
          .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "#10B981");

        const simulation = d3.forceSimulation(nodes)
          .force("link", d3.forceLink(edges).id(d => d.id).distance(isModal ? 160 : 120))
          .force("charge", d3.forceManyBody().strength(isModal ? -550 : -380))
          .force("center", d3.forceCenter(width / 2, height / 2))
          .force("collision", d3.forceCollide().radius(isModal ? 70 : 52));

        const link = g.append("g").selectAll("line").data(edges).join("line")
          .attr("stroke", d => {
            const targetId = typeof d.target === 'object' ? d.target.id : d.target;
            const targetNode = nodes.find(n => n.id === targetId);
            return (targetNode && targetNode.type === '긍정대처') ? "#10B981" : "#FBBF24";
          })
          .attr("stroke-width", d => (isModal ? 4 : 3) + d.weight * 2.5)
          .attr("stroke-opacity", 0.9)
          .attr("stroke-dasharray", d => {
            const targetId = typeof d.target === 'object' ? d.target.id : d.target;
            const targetNode = nodes.find(n => n.id === targetId);
            return (targetNode && targetNode.type === '긍정대처') ? "6,3" : "none";
          })
          .attr("marker-end", d => {
            const targetId = typeof d.target === 'object' ? d.target.id : d.target;
            const targetNode = nodes.find(n => n.id === targetId);
            if (targetNode && targetNode.type === '긍정대처') {
              return `url(#${isModal ? 'arrow-green-m' : 'arrow-green'})`;
            }
            return `url(#${isModal ? 'arrow-m' : 'arrow'})`;
          });

        const node = g.append("g").selectAll("g").data(nodes).join("g").style("cursor", "pointer")
          .on("click", (e, d) => setSelectedNode(d))
          .call(d3.drag()
            .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
            .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
            .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

        const baseRadius = isModal ? 36 : 26;
        node.append("circle")
          .attr("r", d => baseRadius + d.count * (isModal ? 8 : 6))
          .attr("fill", d => {
            if (d.type === '긍정대처') return '#10B981';
            return d.count > 1 ? "#F59E0B" : "#FEF3C7";
          })
          .attr("stroke", d => d.type === '긍정대처' ? '#047857' : '#D97706')
          .attr("stroke-width", isModal ? 4 : 3.5)
          .attr("filter", "drop-shadow(0px 3px 6px rgba(0,0,0,0.15))");

        node.append("text")
          .text(d => d.label.length > (isModal ? 10 : 7) ? d.label.slice(0, isModal ? 9 : 6) + '..' : d.label)
          .attr("text-anchor", "middle").attr("dy", isModal ? 6 : 5)
          .attr("font-size", isModal ? "16px" : "13px").attr("font-weight", "bold")
          .attr("fill", d => {
            if (d.type === '긍정대처') return '#FFFFFF';
            return d.count > 1 ? "#FFFFFF" : "#92400E";
          });

        simulation.on("tick", () => {
          link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
          node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
      };

      useEffect(() => {
        if (viewType === 'graph' && svgRef.current) {
          renderD3(svgRef.current, false);
        }
      }, [chains, viewType]);

      useEffect(() => {
        if (isFullScreen && viewType === 'graph') {
          const timer = setTimeout(() => {
            if (modalSvgRef.current) {
              renderD3(modalSvgRef.current, true);
            }
          }, 80);
          return () => clearTimeout(timer);
        }
      }, [isFullScreen, chains, viewType]);

      return (
        <div className="flex flex-col h-full justify-between">
          <div>
            <div className="bg-amber-100/80 p-5 rounded-3xl border border-amber-200 mb-4 flex items-center justify-between">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="text-3xl">💡</span>
                  <h3 className="text-xl font-bold text-amber-950">내 마음 행동 지도</h3>
                </div>
                <p className="text-sm sm:text-base text-amber-900">
                  총 <strong className="text-amber-800 font-extrabold">{chains.length}번</strong>의 스트레스 & 회복 순간을 분석한 그림입니다.
                </p>
              </div>

              <div className="flex bg-white p-1 rounded-2xl border border-amber-300">
                <button
                  onClick={() => setViewType('graph')}
                  className={`px-3 py-1.5 text-xs font-bold rounded-xl ${
                    viewType === 'graph' ? 'bg-amber-500 text-white' : 'text-slate-600'
                  }`}
                >
                  🕸️ 그물망
                </button>
                <button
                  onClick={() => setViewType('timeline')}
                  className={`px-3 py-1.5 text-xs font-bold rounded-xl ${
                    viewType === 'timeline' ? 'bg-amber-500 text-white' : 'text-slate-600'
                  }`}
                >
                  🛤️ 순서대로
                </button>
              </div>
            </div>

            {/* 범례 안내바 */}
            <div className="flex items-center justify-center gap-4 bg-amber-50/80 py-2 px-3 rounded-2xl border border-amber-200/80 mb-3 text-xs font-bold">
              <span className="flex items-center gap-1.5 text-amber-800">
                <span className="w-3.5 h-3.5 rounded-full bg-amber-500 border border-amber-600 inline-block"></span>
                반복된 단골 행동
              </span>
              <span className="flex items-center gap-1.5 text-slate-600">
                <span className="w-3.5 h-3.5 rounded-full bg-amber-100 border border-amber-300 inline-block"></span>
                일상 반응
              </span>
              <span className="flex items-center gap-1.5 text-emerald-700">
                <span className="w-3.5 h-3.5 rounded-full bg-emerald-500 border border-emerald-600 inline-block"></span>
                🌱 긍정적 대처 (회복로)
              </span>
            </div>

            {hubInfo.label && (
              <div className="bg-white p-4 sm:p-5 rounded-3xl border-2 border-amber-400 shadow-sm mb-4 flex items-center justify-between">
                <div>
                  <span className="text-xs font-extrabold text-amber-800 uppercase tracking-wide block mb-1">
                    ⭐ 가장 자주 반복된 단골 행동/마음 (병목 노드)
                  </span>
                  <div className="text-xl sm:text-2xl font-extrabold text-slate-900">
                    "{hubInfo.label}"
                  </div>
                </div>
                <button
                  onClick={onGoReport}
                  className="px-4 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold shadow-md touch-btn flex items-center gap-1.5"
                >
                  <span>💌</span> 마음 분석 편지 보기
                </button>
              </div>
            )}

            {viewType === 'graph' ? (
              <div className="relative bg-amber-50/50 rounded-3xl border-2 border-amber-200 overflow-hidden shadow-inner p-2">
                <div className="flex justify-between items-center px-2 py-1 mb-1">
                  <span className="text-xs text-amber-800 font-bold">동그라미를 콕 누르면 자세히 보입니다 👆</span>
                  <button
                    onClick={() => setIsFullScreen(true)}
                    className="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs shadow flex items-center gap-1 touch-btn"
                  >
                    <span>🔍</span> 화면 가득 크게보기
                  </button>
                </div>
                <svg ref={svgRef} className="w-full h-[350px]"></svg>
                {selectedNode && (
                  <div className="mt-2 p-3 bg-white rounded-2xl border-2 border-amber-500 shadow-md flex items-center justify-between">
                    <div>
                      <span className="text-xs font-bold text-amber-700 block">선택하신 내용 ({selectedNode.type})</span>
                      <span className="text-lg font-extrabold text-slate-900">{selectedNode.label} ({selectedNode.count}회 등장)</span>
                    </div>
                    <button onClick={() => setSelectedNode(null)} className="text-xs text-slate-400 hover:text-slate-600 p-1">닫기 ✕</button>
                  </div>
                )}
              </div>
            ) : (
              <div className="bg-amber-50/40 rounded-3xl border-2 border-amber-200 p-4 max-h-[440px] overflow-y-auto space-y-4">
                <div className="text-xs text-slate-500 font-bold mb-2">
                  최근 기록 일시: <strong className="text-amber-900 font-extrabold">{chains[0]?.date}</strong>
                </div>
                {chains[0]?.sequence.map((item, idx) => (
                  <div key={idx} className="flex items-center gap-3">
                    <div className={`w-9 h-9 rounded-full text-white font-extrabold text-sm flex items-center justify-center shrink-0 shadow ${
                      item.type === '긍정대처' ? 'bg-emerald-600' : 'bg-amber-500'
                    }`}>
                      {idx + 1}
                    </div>
                    <div className={`flex-1 bg-white p-3.5 rounded-2xl border shadow-sm flex items-center justify-between ${
                      item.type === '긍정대처' ? 'border-emerald-300 bg-emerald-50/30' : 'border-amber-200'
                    }`}>
                      <div>
                        <span className={`text-xs font-bold px-2 py-0.5 rounded-md mr-2 ${
                          item.type === '긍정대처' ? 'text-emerald-800 bg-emerald-100' : 'text-amber-700 bg-amber-50'
                        }`}>{item.type}</span>
                        <span className="text-base font-extrabold text-slate-900">{item.label}</span>
                      </div>
                      {idx < chains[0].sequence.length - 1 && <span className="text-amber-400 font-bold text-lg">➔</span>}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="flex gap-2.5 mt-5">
            <button
              onClick={onGoWizard}
              className="flex-1 py-4 bg-slate-100 hover:bg-slate-200 text-slate-800 font-extrabold text-lg rounded-2xl border border-slate-300 touch-btn"
            >
              ➕ 기록 추가
            </button>
            <button
              onClick={onGoReport}
              className="flex-[2] py-4 bg-amber-600 hover:bg-amber-700 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-amber-600/30 touch-btn flex items-center justify-center gap-2"
            >
              <span>💌</span> 마음 분석 편지 보기
            </button>
          </div>

          {/* 풀스크린 모달 */}
          {isFullScreen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-5xl h-[90vh] rounded-3xl shadow-2xl flex flex-col overflow-hidden border-4 border-amber-400 animate-fadeIn">
                <div className="bg-amber-100 p-5 flex items-center justify-between border-b border-amber-200">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">🔍</span>
                    <div>
                      <h2 className="text-xl sm:text-2xl font-extrabold text-amber-950">시원하게 크게 보는 마음 행동 지도</h2>
                      <p className="text-xs sm:text-sm text-amber-800">초록색 동그라미는 나를 살리는 '긍정적 대처' 탈출로입니다.</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsFullScreen(false)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-2xl text-base shadow touch-btn"
                  >
                    닫기 ✕
                  </button>
                </div>
                <div className="flex-1 relative bg-amber-50/40 p-4 flex flex-col">
                  <svg ref={modalSvgRef} className="w-full h-full flex-1 rounded-2xl bg-white/60 border border-amber-200"></svg>
                  {selectedNode && (
                    <div className="mt-3 p-3.5 bg-white rounded-2xl border-2 border-amber-500 shadow-md flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-amber-700 block">선택 항목: [{selectedNode.type}]</span>
                        <span className="text-lg font-extrabold text-slate-900">{selectedNode.label} (누적 {selectedNode.count}회)</span>
                      </div>
                      <button onClick={() => setSelectedNode(null)} className="text-xs text-slate-400 hover:text-slate-600 p-1">선택 해제 ✕</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 내담자 전용 마음 분석 편지 뷰 (Client Only)
    // ==========================================
    function ClientAIReportView({ chains, nickname }) {
      const calculateMetrics = () => {
        const countsByType = {
          '컨디션': {}, '계기': {}, '생각': {}, '감정': {},
          '몸느낌': {}, '행동': {}, '결과': {}, '긍정대처': {}
        };
        const allCounts = {};
        const inDeg = {}, outDeg = {};

        chains.forEach(c => {
          c.sequence.forEach((s, idx) => {
            const label = s.label;
            allCounts[label] = (allCounts[label] || 0) + 1;
            if (countsByType[s.type]) {
              countsByType[s.type][label] = (countsByType[s.type][label] || 0) + 1;
            }
            if (idx > 0) inDeg[label] = (inDeg[label] || 0) + 1;
            if (idx < c.sequence.length - 1) outDeg[label] = (outDeg[label] || 0) + 1;
          });
        });

        const getTop = (obj, fallback) => {
          const sorted = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
          return sorted[0] ? sorted[0][0] : fallback;
        };

        const sortedAll = Object.entries(allCounts).sort((a, b) => b[1] - a[1]);
        const topBottleneck = getTop(countsByType['행동'], sortedAll[0]?.[0] || '하루 종일 누워있기');
        const ignitionNode = Object.entries(outDeg).sort((a, b) => b[1] - a[1])[0]?.[0] || getTop(countsByType['계기'], '가족과 말다툼');
        const topCondition = getTop(countsByType['컨디션'], '피로와 수면 부족');
        const topTrigger = getTop(countsByType['계기'], '대인관계 갈등 또는 스트레스');
        const topThought = getTop(countsByType['생각'], '부정적 자동적 사고');
        const topEmotion = getTop(countsByType['감정'], '불안 및 무기력');
        const topBody = getTop(countsByType['몸느낌'], '가슴 답답함 및 신체 긴장');
        const topOutcome = getTop(countsByType['결과'], '자책감 및 피로 누적');
        const topPositiveCoping = getTop(countsByType['긍정대처'], '따뜻한 차 마시기 및 심호흡');

        return {
          totalChains: chains.length,
          topBottleneck,
          ignitionNode,
          topCondition,
          topTrigger,
          topThought,
          topEmotion,
          topBody,
          topOutcome,
          topPositiveCoping,
          latestDate: chains[0]?.date || '최근'
        };
      };

      const metrics = calculateMetrics();
      const userName = nickname ? `${nickname} 님` : '선생님';

      const getActionPrescriptions = (action, body, thought, positiveCoping) => {
        const act = (action || '').toLowerCase();
        if (act.includes('누워') || act.includes('잠') || act.includes('침대')) {
          return [
            { icon: '🌱', text: `<strong>[내가 정한 긍정 대처]</strong> 침대에 바로 눕기 전, <strong>"${positiveCoping}"</strong>을(를) 먼저 딱 3분간 실천해 보세요.` },
            { icon: '🪟', text: `몸이 무겁고 가라앉을 땐 침대 대신 <strong>의자나 소파에 앉아 딱 3분간 창밖 바람</strong>을 쐬어보세요.` },
            { icon: '🫂', text: `"${thought}" 생각이 스칠 때 <em>"지금 내 몸과 마음이 쉼을 달라고 신호를 보내는구나"</em>라고 따뜻하게 위로해 주세요.` }
          ];
        } else if (act.includes('피하') || act.includes('연락') || act.includes('문자') || act.includes('방') || act.includes('숨')) {
          return [
            { icon: '🌱', text: `<strong>[내가 정한 긍정 대처]</strong> 사람과 연락을 피하기 전, <strong>"${positiveCoping}"</strong>으로 마음에 작은 숨구멍을 내어주세요.` },
            { icon: '💬', text: `모든 연락을 바로 받지 않아도 괜찮습니다. 대신 <em>"나중에 편할 때 연락할게요"</em>라는 <strong>짧은 한 줄 상용구만 남겨보세요.</strong>` },
            { icon: '🚶', text: `방 안에만 머물기보다 <strong>베란다나 집 앞 골목을 5분간 천천히 걷고</strong> 들어와 보세요.` }
          ];
        } else if (act.includes('식') || act.includes('음식') || act.includes('먹') || act.includes('술') || act.includes('담배')) {
          return [
            { icon: '🌱', text: `<strong>[내가 정한 긍정 대처]</strong> 음식이나 술을 찾기 직전, <strong>"${positiveCoping}"</strong>을(를) 먼저 시도해 보세요.` },
            { icon: '💧', text: `음식을 입에 넣기 전, <strong>시원한 물 한 컵을 먼저 마시고 3분 타이머</strong>를 맞추어 짧은 쉼(Pause)을 가져보세요.` },
            { icon: '🏷️', text: `지금 느끼는 갈증이 '마음의 허기'인지 '몸의 배고픔'인지 가만히 이름을 붙여보세요.` }
          ];
        } else {
          return [
            { icon: '🌱', text: `<strong>[내가 정한 긍정 대처]</strong> 익숙한 습관(${action})으로 가기 전, <strong>"${positiveCoping}"</strong>을(를) 1순위로 실행해 보세요.` },
            { icon: '🌬️', text: `신체 반응(${body})이 느껴질 때 <strong>3번의 깊은 복식호흡</strong>으로 10초간의 짧은 쉼표를 만들어보세요.` },
            { icon: '🦶', text: `양발을 바닥에 단단히 딛고 <strong>주변 물건 3가지의 색깔을 관찰</strong>하는 그라운딩(Grounding)을 실천해 보세요.` }
          ];
        }
      };

      const prescriptions = getActionPrescriptions(metrics.topBottleneck, metrics.topBody, metrics.topThought, metrics.topPositiveCoping);

      return (
        <div className="space-y-5 animate-fadeIn">
          {/* 상단 타이틀 카드 */}
          <div className="bg-amber-100/80 border border-amber-300 rounded-3xl p-5 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="text-4xl">💌</span>
              <div>
                <span className="text-xs font-bold text-amber-800 block">임상심리 AI 마음 분석서</span>
                <h3 className="text-xl font-black text-amber-950">{userName}을 위한 따뜻한 마음 편지</h3>
              </div>
            </div>
            <span className="text-xs px-3 py-1 bg-white text-amber-900 border border-amber-300 rounded-full font-bold">
              총 {metrics.totalChains}회 분석
            </span>
          </div>

          {/* 본문 리포트 카드 */}
          <div className="bg-white p-6 rounded-3xl border-2 border-amber-300 shadow-sm space-y-5">
            <div className="border-b border-amber-100 pb-3">
              <span className="text-xs font-extrabold text-amber-700 bg-amber-100 px-3 py-1 rounded-full">
                마음의 길잡이
              </span>
              <h4 className="text-2xl font-extrabold text-slate-900 mt-2">
                "선생님의 소중한 기록 {metrics.totalChains}번을 분석해 마음의 길을 찾아드립니다"
              </h4>
              <p className="text-xs text-slate-400 mt-1">최근 기록 일시: {metrics.latestDate}</p>
            </div>

            <div className="space-y-4 text-base sm:text-lg text-slate-700 leading-relaxed">
              <div className="p-4 bg-amber-50/70 rounded-2xl border border-amber-200">
                <span className="font-extrabold text-amber-900 block mb-1">
                  1. 마음의 신호등: 불이 켜지는 순간 🚦
                </span>
                {userName}께서는 일상에서 <strong>"{metrics.topTrigger}"</strong>이나 컨디션 저하가 발생할 때, 가슴속에서 <strong>"{metrics.topEmotion}"</strong> 마음과 함께 몸에서 <strong>"{metrics.topBody}"</strong> 반응이 가장 먼저 찾아옵니다. <br/>
                이것은 약해서가 아니라, 몸과 마음이 <em>"지금 너무 힘들어요, 잠시 쉬어가요"</em>라고 보내는 정직한 신호입니다.
              </div>

              <div className="p-4 bg-rose-50/70 rounded-2xl border border-rose-200">
                <span className="font-extrabold text-rose-900 block mb-1">
                  2. 단골 행동의 덫: 왜 "{metrics.topBottleneck}"을(를) 하게 될까요? 🔄
                </span>
                마음이 복잡하고 <strong>"{metrics.topThought}"</strong> 생각이 맴돌 때, {userName}의 마음은 본능적으로 <strong>"{metrics.topBottleneck}"</strong> 행동을 선택하게 됩니다. <br/>
                그 순간만큼은 괴로움에서 벗어날 수 있어 일시적인 안도감을 주지만, 시간이 지나면 <strong>"{metrics.topOutcome}"</strong>(으)로 이어져 마음에 더 큰 짐을 남기는 악순환이 생겨납니다.
              </div>

              <div className="p-4 bg-emerald-50/70 rounded-2xl border border-emerald-200">
                <span className="font-extrabold text-emerald-900 block mb-1.5">
                  3. {userName}을 위한 마음의 브레이크 (맞춤 실천 처방 & 긍정 대처) 🌻
                </span>
                <ul className="space-y-2.5 text-emerald-950 font-medium text-base">
                  {prescriptions.map((item, idx) => (
                    <li key={idx} className="flex items-start gap-2">
                      <span className="text-lg shrink-0">{item.icon}</span>
                      <span dangerouslySetInnerHTML={{ __html: item.text }} />
                    </li>
                  ))}
                </ul>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
